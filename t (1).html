<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UbiDesk — Sign in</title>
<style>
:root{--cream:#f8efdb;--ink:#3b2b1d;--orange:#c8642d;--moss:#5f7f5b;--teal:#274e52;--ochre:#d9a45b;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--shade:rgba(58,38,18,.34)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#1f3a3c;font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;background:radial-gradient(120% 75% at 70% 22%,#fbf3e1,#f3e8d2 42%,#ecd9b4)}
.layer{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;will-change:transform}
.layer>svg{width:100%;height:100%;overflow:visible;display:block}
.cut{filter:drop-shadow(0 -1px 0 rgba(255,250,236,.5)) drop-shadow(0 4px 6px var(--shade))}
.grain{fill:url(#g)}
#hang{z-index:1}#l1{z-index:2}#l2{z-index:3}#l3{z-index:4}#l4{z-index:5}#l5{z-index:6}#l6{z-index:7}#l7{z-index:12}
/* hanging things */
.hang{position:absolute;top:0}
.swing{position:relative;transform-origin:50% 0;animation:sw var(--sd,5s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.string{position:absolute;left:50%;top:0;width:1px;height:var(--len);background:linear-gradient(rgba(74,54,34,.2),rgba(74,54,34,.65))}
.obj{position:absolute;left:50%;top:var(--len);transform:translate(-50%,-6%);filter:drop-shadow(0 5px 6px var(--shade))}
.obj svg{display:block;overflow:visible}
@keyframes sw{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
/* girl */
#girl{position:fixed;z-index:8;cursor:pointer;filter:drop-shadow(0 3px 0 rgba(255,250,236,.55)) drop-shadow(0 6px 7px var(--shade))}
#gs{position:fixed;z-index:7;pointer-events:none;border-radius:50%;background:radial-gradient(closest-side,rgba(58,38,18,.4),transparent)}
/* animation actors */
.fx{position:fixed;left:0;top:0;pointer-events:none;opacity:0;will-change:transform}
#bird{z-index:30;margin:-30px 0 0 -45px}
#env{z-index:31;margin:-20px 0 0 -28px;filter:drop-shadow(0 4px 4px var(--shade))}
#tk{z-index:30;margin:-19px 0 0 -13px;filter:drop-shadow(0 3px 3px var(--shade))}
#tl{position:fixed;inset:0;width:100%;height:100%;z-index:29;pointer-events:none}
#msg{z-index:9;margin:-34px 0 0 0;opacity:0;transform-origin:50% 100%;font:600 11px/1 var(--serif);background:var(--cream);padding:6px 10px 7px;white-space:nowrap;clip-path:polygon(0 0,100% 2%,99% 78%,58% 80%,50% 100%,44% 80%,1% 82%);filter:none}
#msg b{color:#3d8a4e;margin-right:4px}
#msg.on{animation:pop .5s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,6px) scale(.3)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
#pl{z-index:9;margin:-15px 0 0 -19px}
#ring{z-index:9;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #ffd98a;box-shadow:0 0 14px #ffd98a}
#ring.on{animation:rg .9s ease-out}
@keyframes rg{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(3)}}
.dot{position:fixed;z-index:9;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff6df;box-shadow:0 0 0 1px rgba(200,100,45,.5);pointer-events:none;animation:df 1.4s forwards}
@keyframes df{to{opacity:0;transform:scale(.2)}}
/* login column — no box, just paper on the scene */
.col{position:fixed;z-index:15;left:clamp(28px,7vw,120px);top:0;bottom:0;width:min(370px,calc(100vw - 56px));display:flex;flex-direction:column}
.brand{position:relative;align-self:flex-start;width:min(236px,100%);margin-top:clamp(26px,5vh,48px);transform-origin:50% -60px;animation:sw 6s ease-in-out infinite alternate}
.brand::before{content:"";position:absolute;left:50%;bottom:100%;width:1px;height:80px;background:linear-gradient(rgba(74,54,34,.2),rgba(74,54,34,.7))}
.tag{position:relative;background:var(--cream);text-align:center;padding:32px 14px 14px;clip-path:polygon(24% 0,76% 0,100% 14%,100% 100%,0 100%,0 14%);filter:none}
.hole{position:absolute;left:50%;top:10px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#2e4d4a;box-shadow:0 0 0 3px var(--ochre)}
.wrap{filter:drop-shadow(2px 8px 7px var(--shade))}
.tag svg{width:clamp(56px,10vh,84px);height:auto;display:block;margin:0 auto 2px;overflow:visible}
.word{font-size:clamp(30px,4.4vh,38px);line-height:1;letter-spacing:-.01em}
.word i{color:var(--orange);font-size:1.1em}
.tag p{margin:7px 0 0;font-size:12.5px;font-style:italic;color:#5b4632}
form{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(5px,1.2vh,12px);position:relative;padding:8px 0 clamp(54px,9vh,80px)}
label{align-self:flex-start;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8a4a20;background:var(--cream);padding:4px 9px 3px;clip-path:polygon(0 8%,100% 0,98% 100%,2% 92%);margin-bottom:-4px}
.fld{position:relative;filter:drop-shadow(0 3px 4px var(--shade))}
input{display:block;width:100%;border:0;margin:0;padding:13px 44px 13px 16px;font:15px var(--serif);color:var(--ink);background:#f8efdb;outline:none;clip-path:polygon(1% 4%,30% 0,64% 3%,99% 0,100% 50%,99% 97%,64% 100%,30% 96%,0 100%,0 48%);transition:background .2s,box-shadow .2s}
input::placeholder{color:#9b8566;font-style:italic}
input:focus{background:#fffaf0;box-shadow:inset 0 0 0 2px var(--orange)}
#eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;color:#6b5238;cursor:pointer;padding:4px}
#eye:focus-visible{outline:2px solid var(--orange);border-radius:6px}
.forgot{align-self:flex-end;font-size:12px;font-style:italic;color:var(--ink);background:var(--cream);padding:4px 10px;text-decoration:none;clip-path:polygon(0 6%,100% 0,99% 94%,1% 100%);margin-top:-2px}
.forgot:hover{color:var(--orange)}
.cta{position:relative;margin-top:clamp(6px,2vh,18px);animation:sw 7s ease-in-out infinite alternate;transform-origin:calc(100% - 26px) -70vh}
.cta::before{content:"";position:absolute;right:26px;bottom:100%;width:1px;height:100vh;background:linear-gradient(rgba(74,54,34,.15),rgba(74,54,34,.65));z-index:-1}
.cta button{display:block;width:100%;border:0;padding:15px;font:600 14px var(--serif);letter-spacing:.2em;text-transform:uppercase;color:#f8efdb;background:var(--teal);cursor:pointer;clip-path:polygon(1% 6%,30% 0,62% 4%,99% 1%,100% 52%,98% 96%,64% 100%,34% 97%,1% 100%,0 48%);transition:background .25s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.cta .fld{filter:drop-shadow(0 6px 6px var(--shade))}
.cta button:hover{background:var(--orange);transform:translateY(-2px)}
.cta button:active{transform:translateY(1px) scale(.98)}
.cta button:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #ffd98a}
.foot{position:absolute;left:0;right:0;bottom:clamp(16px,3.4vh,32px);display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.foot a,.foot span{background:var(--cream);padding:5px 11px;color:var(--ink);text-decoration:none;clip-path:polygon(0 6%,100% 0,99% 94%,1% 100%)}
.foot span{font:600 11px var(--serif);letter-spacing:.1em;color:#274e52}
.vig{position:fixed;inset:0;z-index:40;pointer-events:none;box-shadow:inset 0 0 14vmin rgba(60,36,14,.22)}
@media (max-width:760px){.col{left:50%;transform:translateX(-50%)}.brand{align-self:center}.foot{position:static;margin-top:10px}form{padding-bottom:8px;justify-content:flex-start;gap:7px}}
@media (prefers-reduced-motion:reduce){.swing,.brand,.cta{animation:none}}
</style></head><body>

function trace(p,j,st){let s='';const n=p.length;for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,k=Math.max(1,Math.round(L/st)),nx=-dy/L,ny=dx/L;for(let t=0;t<k;t++){let x=a[0]+dx*t/k,y=a[1]+dy*t/k;if(t){const o=(R()-.5)*2*j;x+=nx*o;y+=ny*o}s+=(s?'L':'M')+q(x)+' '+q(y)}}return s+'Z'}

const wave=(b,A,Ls)=>{const ph=A.map(()=>R()*6.28);return x=>{let y=b;A.forEach((a,i)=>y+=a*Math.sin(x/Ls[i]*6.283+ph[i]));return y}};
const ridge=(f,bot,st=9)=>{const p=[];for(let x=-M;x<=W+M+st;x+=st)p.push([x,f(x)+(R()-.5)*1.6]);p.push([W+M+st,bot],[-M,bot]);return poly(p)};
function pine(cx,by,h,w){const n=h>200?7:h>80?5:4,tip=by-h,st=h*.92/(n+.45),j=Math.max(.45,h/520),sp=Math.max(5,h/70);let d='';for(let i=0;i<n;i++){const top=tip+i*st,bot=tip+(i+1.45)*st,b=w*.5*(.26+.74*Math.pow((i+1)/n,.9)),hr=b*rr(.92,1.08),hl=b*rr(.92,1.08);d+=cut([[cx,top],[cx+hr,bot],[cx+hr*.5,bot-st*.28],[cx,bot-st*.18],[cx-hl*.5,bot-st*.28],[cx-hl,bot]],j,sp)}const t=Math.max(1.4,w*.055);return d+cut([[cx-t,by+4],[cx-t,by-h*.12],[cx+t,by-h*.12],[cx+t,by+4]],.3,8)}
const blade=(x,y,h,l,w)=>poly([[x-w/2,y],[x+l*.5-w*.3,y-h*.55],[x+l,y-h],[x+l*.5+w*.3,y-h*.55],[x+w/2,y]]);
const mk=(f,d)=>`<path fill="${f}" d="${d}"/><path class="grain" d="${d}"/>`;
const set=(id,h)=>{const s=$('#'+id+' svg');s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.innerHTML=h};

/* ---- the logo: a paper-cut tree of overlapping discs ---- */
function logo(){R=mul(42);let s='';
 s+=`<path fill="#3b2b1d" d="${poly([[58.6,110],[58.8,64],[61.2,64],[61.4,110]])}${poly([[59,76],[40,64],[41.5,62],[60,73]])}${poly([[61,76],[80,64],[78.5,62],[60,73]])}"/>`;
 for(const [x,y,r,c] of [[28,58,19,'#c8642d'],[94,56,19,'#274e52'],[34,34,14,'#9bb89b'],[87,32,14,'#d98a5b'],[60,32,27,'#5f7f5b'],[60,68,17,'#d9a45b'],[44,66,12,'#efc27d'],[78,68,12,'#3d6a50']])
  s+=`<path fill="${c}" d="${cut(circ(x,y,r),.6,4)}"/>`;
 s+=`<path fill="#3b2b1d" d="${cut([[14,108],[60,104],[106,108],[60,112]],.4,5)}"/><path fill="url(#g)" d="${cut(circ(60,32,27),.2,50)}"/>`;
 $('#logo').innerHTML=s}

/* ---- the diorama ---- */
function scene(){R=mul(1847);const U=Math.sqrt(W*H)/100,port=W<760||H>W*1.1;
 const f1=wave(H*.4,[H*.034,H*.016],[W*1.1,W*.4]);set('l1',mk('#dfdec3',ridge(f1,H+M)));
 const f2=wave(H*.5,[H*.036,H*.014],[W*.9,W*.3]);let d2=ridge(f2,H+M);
 for(let x=-M;x<W+M;x+=rr(6,16))if(Math.sin(x/W*8.5)+Math.sin(x/W*21)*.5>.35){const h=rr(2,4)*U;d2+=pine(x,f2(x)+3,h,h*.55)}
 set('l2',mk('#bdcfb2',d2));
 const f3=wave(H*.56,[H*.014,H*.007],[W*.7,W*.23]);let d3=ridge(f3,H+M);
 for(let x=-M;x<W+M;){const h=rr(3.6,7.4)*U,w=h*rr(.46,.58);d3+=pine(x,f3(x)+4,h,w);x+=w*rr(.42,.8)}
 set('l3',mk('#9bb89b',d3));
 const f4=wave(H*.62,[H*.008,H*.004],[W*.8,W*.25]);set('l4',mk('#7e9c74',ridge(f4,H+M,10)));
 let d5='';const fb=wave(GY,[2],[W]);
 for(const [gx,gh,gw] of port?[[1.02,.5,.34],[.04,.4,.3]]:[[.99,.92,.26],[.935,.55,.22]])d5+=pine(W*gx,GY+6,H*gh,Math.min(H*gh*.42,W*gw));
 set('l5',mk('#274e52',d5));
 gnd=wave(GY,[H*.006,H*.003],[W*.7,W*.22]);let d6=ridge(gnd,H+M,8),t='',pb='',l1='',l2='';
 for(let x=-M;x<W+M;x+=rr(18,60)){const y=gnd(x)+2;for(let k=0;k<4;k++)t+=blade(x+k*2.2,y+2,rr(.9,2.1)*U,rr(-.6,.6)*U,rr(2,3.4))}
 for(let i=0;i<10;i++){const x=rr(.03,.97)*W,y=gnd(x)+rr(1,6)*U,r=rr(.3,.7)*U;pb+=cut(circ(x,y,r,9).map(([a,b])=>[a,y+(b-y)*.6]),.25,3)}
 for(let i=0;i<W/45;i++){const x=rr(-.02,1.02)*W,y=gnd(x)+U*2+Math.pow(R(),1.3)*(H*.97-gnd(x)-U*2),sz=rr(.45,.9)*U,a=R()*3.1,ca=Math.cos(a),sa=Math.sin(a),lp=[[-1,0],[-.3,-.42],[.35,-.36],[1,0],[.3,.4],[-.35,.36]].map(([u,v])=>[x+(u*ca-v*sa*.8)*sz,y+(u*sa+v*ca*.8)*sz*.62]);if(R()<.6)l1+=cut(lp,.2,3);else l2+=cut(lp,.2,3)}
 set('l6',`<path fill="#d9a45b" d="${d6}"/><path fill="#c9713a" d="${l1}"/><path fill="#b98f4c" d="${l2}"/><path fill="#8a9a55" d="${t}"/><path fill="#e9dcc0" d="${pb}"/><path class="grain" d="${d6}"/>`);
 const g8=wave(H*.965,[H*.006],[W*.5]);let d8=ridge(g8,H+M,9),b2='';
 for(let x=-M;x<W+M;x+=rr(3.5,8)){const s=Math.abs(x-W/2)/(W/2),h=H*(.012+.1*Math.pow(clamp(s,0,1.2),2.4))*rr(.4,1);const b=blade(x,g8(x)+6,h,rr(-.38,.38)*h,rr(4,9));if(R()<.3)b2+=b;else d8+=b}
 set('l7',`<path fill="#3d6a50" d="${b2}"/><path fill="#1f4245" d="${d8}"/><path class="grain" d="${d8}${b2}"/>`);
 /* hung sun and clouds */
 let rays=[];for(let i=0;i<44;i++){const a=i/44*6.283,r=i%2?47:58;rays.push([Math.cos(a)*r,Math.sin(a)*r])}
 const sd=clamp(Math.min(W,H)*.15,70,150),sun=`<svg viewBox="-62 -62 124 124" width="${sd}" height="${sd}"><path fill="#c8642d" d="${cut(rays,.5,5)}"/><path fill="#d9a45b" d="${cut(circ(0,0,42,40),.5,5)}"/><path fill="#e6b772" d="${cut(circ(-4,-5,29,30),.4,5)}"/></svg>`;
 const cl=sc=>{let d='';for(const [x,y,r] of [[-30,4,17],[-9,-9,24],[16,-5,20],[35,6,13]])d+=cut(circ(x*sc,y*sc,r*sc,22),.5,5);return d+cut([[-46*sc,20*sc],[-46*sc,6*sc],[48*sc,6*sc],[48*sc,20*sc]],.5,6)};
 const it=[[port?.78:.6,port?.2:.2,sun,sd,1],[port?.4:.46,port?.36:.33,0,.17,2],[port?.88:.9,.46,0,.12,3]];
 $('#hang').innerHTML=it.map(([x,y,h,s,i],k)=>{const w=h?s:Math.min(W,H)*s*1.1,len=H*y;return `<div class="hang" style="left:${q(W*x)}px;--len:${q(len)}px"><div class="swing" style="--sd:${4+k*1.3}s;--dl:-${k*1.7}s"><span class="string"></span><div class="obj">${h||`<svg viewBox="-52 -36 104 60" width="${q(w)}" height="${q(w*.58)}"><path fill="#fbf6ea" d="${cl(1)}"/></svg>`}</div></div></div>`}).join('')}

/* ---- layout (girl, ground, animation targets) ---- */
function layout(){W=innerWidth;H=innerHeight;const port=W<760||H>W*1.1;GY=H*(port?.86:.8);
 let gh=clamp(port?Math.min(H*.24,W*.5/AR):Math.min(H*.46,W*.34/AR),140,400);const gw=gh*AR;
 scene();logo();const cx=W*(port?.5:.72),bot=gnd(cx)+8;
 G={cx,gw,gh,top:bot-gh,bot,left:cx-gw/2};
 Object.assign($('#girl').style,{left:G.left+'px',top:G.top+'px',height:gh+'px',width:gw+'px'});
 Object.assign($('#gs').style,{left:cx-gw*.58+'px',top:bot-9+'px',width:gw*1.16+'px',height:'18px'});
 G.lx=G.left+FX*gw;G.ly=G.top+FY*gh;
 /* bird path: in from the right, U-turn near the left edge, back along a lower line */
 SP=Math.max(260,W*.27);const y2=clamp(G.top-62,H*.2,H*.4),r=clamp((y2-H*.05)/2,48,90),y1=y2-2*r,xl=r+W*.05;pts=[];
 const bob=(x,ph)=>Math.sin(x*.011+ph)*7*clamp((x-xl)/200,0,1);
 for(let x=W+110;x>xl;x-=4)pts.push([x,y1+bob(x,0)]);
 for(let a=-Math.PI/2;a>-Math.PI*1.5;a-=4/r)pts.push([xl+Math.cos(a)*r,y1+r+Math.sin(a)*r]);
 const uEnd=pts.length;for(let x=xl;x<W+130;x+=4)pts.push([x,y2+bob(x,1)]);
 cum=[0];for(let i=1;i<pts.length;i++)cum[i]=cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);LT=cum[cum.length-1];
 TX=Math.min(G.cx+gw*.3,W-50);const xd=Math.max(xl+60,TX-SP/2.2);let i=uEnd;while(i<pts.length-1&&pts[i][0]<xd)i++;DD=cum[i];
 restart()}
const at=d=>{const i=clamp(d/4,0,pts.length-2.001),i0=i|0,f=i-i0,a=pts[i0],b=pts[i0+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]};

/* ---- the little film ---- */
const E={bird:$('#bird'),env:$('#env'),tk:$('#tk'),msg:$('#msg'),pl:$('#pl'),ring:$('#ring'),wb:$('#wb'),wf:$('#wf'),th:$('#th')};
const put=(el,x,y,r=0,sx=1,sy=1,o=1)=>{el.style.transform=`translate(${q(x)}px,${q(y)}px) rotate(${r.toFixed(3)}rad) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;el.style.opacity=o};
const bez=(a,b,c,d,u)=>{const v=1-u;return[0,1].map(k=>v*v*v*a[k]+3*v*v*u*b[k]+3*v*u*u*c[k]+u*u*u*d[k])};
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
let T0=0,S;
function restart(){T0=performance.now();S={rel:null,tks:null,tkDone:false,pl:null,end:0,land:null,dots:0};
 for(const k of['env','tk','msg','pl','ring'])E[k].style.opacity=0;E.msg.classList.remove('on');E.ring.classList.remove('on');
 E.env.style.zIndex=31;E.tk.style.zIndex=30;E.th.style.display='';}
function film(t,n){
 const d=SP*(t-.5);
 if(d>=0&&d<=LT){const [x,y]=at(d),[x2,y2]=at(d+3),[x1,y1]=at(Math.max(0,d-3)),vx=(x2-x1)*SP/6/(3),vy=(y2-y1)/6*3;
  const vxs=(x2-x1)/6*SP/ (SP/ (SP)) ; 
  const sx=Math.tanh((x2-x1)/6*1.2/.5),ang=Math.atan2((y2-y1),Math.abs(x2-x1)+2.4)*(sx>=0?1:-1);
  put(E.bird,x,y,ang,sx,1);const w=Math.sin(n*15);E.wb.setAttribute('transform',`rotate(${w*34} -2 -8)`);E.wf.setAttribute('transform',`rotate(${w*34} -2 -8)`);
  if(!S.rel){const ph=.3*Math.sin(n*3.4)-(x2-x1)/6*.28,ax=x,ay=y+22,L=44,ex=ax+L*Math.sin(ph),ey=ay+L*Math.cos(ph);
   put(E.env,ex,ey,ph);put(E.tk,ex+16*Math.sin(ph),ey-16*Math.cos(ph),ph);
   E.th.setAttribute('x1',ax);E.th.setAttribute('y1',ay);E.th.setAttribute('x2',ex+19*Math.sin(ph)*-1);E.th.setAttribute('y2',ey-19*Math.cos(ph));
   if(d>=DD)S.rel={t,x0:ex,y0:ey,vx:(x2-x1)/6*SP/ (SP/ 1)/1,r0:ph};
  }}else E.bird.style.opacity=0;
 if(S.rel){const r=S.rel,tt=t-r.t;E.th.style.display='none';E.env.style.zIndex=7;E.tk.style.zIndex=9;
  const EG=G.bot-12,k=2.2,c=2.4,vt=300;let x,y,rot,sx;
  if(!S.land){x=r.x0+SP*(1-Math.exp(-k*tt))/k+22*Math.sin(4.4*tt)*Math.min(1,tt*2);y=r.y0+vt*(tt-(1-Math.exp(-c*tt))/c);
   rot=r.r0*Math.exp(-3*tt)+.5*Math.cos(4.4*tt+.4)*(1-Math.exp(-3*tt));sx=Math.max(.2,Math.abs(Math.cos(3*tt+.3)));
   if(y>=EG){S.land={t,x,rot};y=EG}}
  if(S.land){const u=clamp((t-S.land.t)/.5,0,1);x=S.land.x;y=EG-Math.sin(u*Math.PI)*7;rot=S.land.rot+(-.2-S.land.rot)*u;sx=.5+.5*u}
  const fade=S.end&&t>S.end+1.6?clamp(1-(t-S.end-1.6),0,1):1;put(E.env,x,y,rot,sx,1,fade);
  /* the ticket peels away, curves over the girl and slides into the laptop */
  if(!S.tks&&tt>.3)S.tks={t,p0:[E.tkx||x,E.tky||y-16]};
  if(!S.tks){put(E.tk,x+16*Math.sin(rot),y-16*Math.cos(rot),rot,sx,1);E.tkx=x+16*Math.sin(rot);E.tky=y-16*Math.cos(rot)}
  else if(!S.tkDone){const u=clamp((t-S.tks.t)/1.3,0,1),e=ease(u),p0=S.tks.p0,p3=[G.lx,G.ly],pp=bez(p0,[p0[0]-30,p0[1]-80],[p3[0]-20,p3[1]-110],p3,e),ins=clamp((u-.82)/.18,0,1);
   put(E.tk,pp[0],pp[1]+ins*8,(1-e)*.9*Math.sin(e*9)+(1-e)*.6,1-ins*.7,1-ins*.2+Math.abs(Math.cos(e*7))*.0,1-ins);
   if(u>=1){S.tkDone=true;S.tm=t;E.tk.style.opacity=0;E.ring.style.left=G.lx+'px';E.ring.style.top=G.ly+'px';E.ring.style.transform='';E.ring.classList.add('on');
    E.msg.style.left=G.lx+'px';E.msg.style.top=(G.top+8)+'px';E.msg.classList.add('on')}}
  if(S.tkDone){ if(!S.pl&&t>S.tm+.8)S.pl={t};
   if(t>S.tm+4)E.msg.style.opacity=Math.max(0,1-(t-S.tm-4)*2);
   if(S.pl){const u=clamp((t-S.pl.t)/3.6,0,1),e=Math.pow(u,1.35),p0=[G.lx+10,G.ly-12],p3=[W+90,G.ly-H*.5],pp=bez(p0,[G.lx+G.gw*.1,G.ly-H*.3],[W*.8,G.ly-H*.42],p3,e),q2=bez(p0,[G.lx+G.gw*.1,G.ly-H*.3],[W*.8,G.ly-H*.42],p3,Math.min(1,e+.02)),a=Math.atan2(q2[1]-pp[1],q2[0]-pp[0]),s=.4+.6*clamp(u*5,0,1);
    put(E.pl,pp[0],pp[1],a,s,s,1);if(t-S.dots>.07){S.dots=t;const o=document.createElement('i');o.className='dot';o.style.left=pp[0]+'px';o.style.top=pp[1]+'px';document.body.appendChild(o);setTimeout(()=>o.remove(),1500)}
    if(u>=1&&!S.end){S.end=t;E.pl.style.opacity=0}}}
  if(S.end&&t>S.end+3.4)restart();}
}
/* ---- parallax + loop ---- */
let px=0,py=0,tx=0,ty=0;const LY=[['l1',.2],['l2',.35],['l3',.5],['l4',.7],['l5',1],['l7',1.6],['hang',.3]].map(([i,f])=>[$('#'+i),f]);
addEventListener('pointermove',e=>{tx=(e.clientX/W-.5)*2;ty=(e.clientY/H-.5)*2});
$('#girl').addEventListener('click',restart);
function frame(now){requestAnimationFrame(frame);px+=(tx-px)*.06;py+=(ty-py)*.06;
 for(const [el,f] of LY)el.style.transform=`translate3d(${q(-px*f*14)}px,${q(-py*f*8)}px,0)`;
 film((now-T0)/1000,now/1000)}
/* ---- paper grain ---- */
(()=>{const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d'),id=g.createImageData(160,160),d=id.data;
 for(let i=0;i<d.length;i+=4){const n=Math.random();if(n<.5){d[i]=74;d[i+1]=52;d[i+2]=30;d[i+3]=(.5-n)*46}else{d[i]=255;d[i+1]=251;d[i+2]=240;d[i+3]=(n-.5)*40}}
 g.putImageData(id,0,0);for(let k=0;k<90;k++){g.strokeStyle=k%3?'rgba(255,252,242,.2)':'rgba(96,66,36,.13)';g.lineWidth=.6;g.beginPath();const x=Math.random()*160,y=Math.random()*160,a=Math.random()*6.28,l=4+Math.random()*14;g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
 $('#gi').setAttribute('href',c.toDataURL())})();
/* ---- form ---- */
const pw=$('#pw'),sl=$('#slash');$('#eye').onclick=()=>{const s=pw.type==='password';pw.type=s?'text':'password';sl.style.display=s?'none':'';$('#eye').setAttribute('aria-label',s?'Hide password':'Show password')};
$('#f').addEventListener('submit',e=>{e.preventDefault();$('#go').textContent='Authenticating…';/* hook your real auth call here */setTimeout(()=>$('#go').textContent='Initialize auth',1600)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,150)});
layout();requestAnimationFrame(frame);
})();
</script></body></html>
