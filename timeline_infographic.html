<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Timeline Infographic</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Crispy Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Authentic Neumorphic Soft Clay Palette */
            --bg-color: #e6edf5;
            --neu-dark: #b6c4d6;
            --neu-light: #ffffff;
            --text-main: #2c3e50;
            --text-carved: -1px -1px 1px #c5bcb0, 1px 1px 1px #ffffff;
            --coral-accent: #3b82f6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Extruded Main Card Canvas */
        .neu-card-canvas {
            background: #e6edf5;
            box-shadow: 20px 20px 50px #b5c3d5, -20px -20px 50px #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Subtle Carved / Embossed Text Effect */
        .carved-title {
            color: #334155;
            text-shadow: -1px -1px 1px #cbd5e1, 1px 1px 1px #ffffff;
        }

        /* Interactive Pill Capsules with Extruded & Pressed Neumorphic States */
        .pill-node {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pill-node:hover {
            transform: translateY(-3px) scale(1.05);
        }

        .pill-node:active, .pill-node.active-pressed {
            transform: translateY(1px) scale(0.98);
        }

        /* Recessed Text Container Slot */
        .recessed-slot {
            background: #e6edf5;
            border-radius: 16px;
            box-shadow: inset 4px 4px 8px #b5c3d5, inset -4px -4px 8px #ffffff;
            padding: 12px 16px;
        }

        /* Editable text focus styling */
        [contenteditable="true"]:hover {
            outline: 2px dashed #3b82f6;
            outline-offset: 4px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.5);
        }

        [contenteditable="true"]:focus {
            outline: 2px solid #2563eb;
            outline-offset: 4px;
            border-radius: 6px;
            background: #ffffff;
        }
    </style>
</head>
<body class="p-2 sm:p-6 w-full flex flex-col items-center justify-center">

    <!-- MAIN SLIDE CANVAS (16:9 ASPECT RATIO) -->
    <main class="w-full max-w-[1280px] relative flex flex-col items-center justify-center">
        
        <div id="slideCanvas" class="w-full aspect-[16/9] neu-card-canvas rounded-3xl overflow-hidden relative select-none flex items-center justify-center p-4">
            
            <!-- SVG VECTOR GRAPHIC CANVAS -->
            <svg id="timelineSvg" viewBox="0 0 1200 675" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Vibrant Gradient Tube Track -->
                    <linearGradient id="serpentineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1d4ed8"/>
                        <stop offset="25%" stop-color="#0284c7"/>
                        <stop offset="50%" stop-color="#06b6d4"/>
                        <stop offset="75%" stop-color="#10b981"/>
                        <stop offset="100%" stop-color="#059669"/>
                    </linearGradient>

                    <!-- Dual Extruded Drop Shadow for Pills (Light Top-Left, Dark Bottom-Right) -->
                    <filter id="neuPillExtrude" x="-40%" y="-40%" width="180%" height="180%">
                        <feDropShadow dx="5" dy="6" stdDeviation="5" flood-color="#a8b8cc" flood-opacity="0.8"/>
                        <feDropShadow dx="-5" dy="-5" stdDeviation="5" flood-color="#ffffff" flood-opacity="1"/>
                    </filter>

                    <!-- Large Badge Extruded Ring Shadow -->
                    <filter id="neuBadgeExtrude" x="-40%" y="-40%" width="180%" height="180%">
                        <feDropShadow dx="10" dy="12" stdDeviation="12" flood-color="#9eb0c6" flood-opacity="0.75"/>
                        <feDropShadow dx="-10" dy="-10" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.95"/>
                    </filter>

                    <!-- Recessed Trench Inset Filter for Badge Ring Groove -->
                    <filter id="neuRecessedGroove" x="-30%" y="-30%" width="160%" height="160%">
                        <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#a0b1c7" flood-opacity="0.6"/>
                        <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.9"/>
                    </filter>

                    <!-- Serpentine Path Trench Shadow -->
                    <filter id="pathShadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#64748b" flood-opacity="0.25"/>
                    </filter>

                    <!-- Badge Bezel Surface Gradients -->
                    <linearGradient id="badgeSurfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#e2e8f0"/>
                    </linearGradient>

                    <linearGradient id="badgeBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f1f5f9"/>
                        <stop offset="100%" stop-color="#cbd5e1"/>
                    </linearGradient>
                </defs>

                <text x="600" y="70" text-anchor="middle" font-size="36" font-weight="800" fill="#2c3e50" letter-spacing="-0.5" class="carved-title cursor-pointer" onclick="makeEditable(this)">Timeline</text>

                <!-- LEFT SIDE PARAGRAPH SLOT (RECESSED NEUMORPHIC TRENCH) -->
                <g transform="translate(60, 200)">
                    <foreignObject width="170" height="180">
                        <div xmlns="http://www.w3.org/1999/xhtml" class="recessed-slot text-[12px] text-slate-600 leading-relaxed font-medium select-text" contenteditable="true" id="leftDescText">

                        </div>
                    </foreignObject>
                </g>

                <!-- RIGHT SIDE PARAGRAPH SLOT (RECESSED NEUMORPHIC TRENCH) -->
                <g transform="translate(970, 470)">
                    <foreignObject width="170" height="180">
                        <div xmlns="http://www.w3.org/1999/xhtml" class="recessed-slot text-[12px] text-slate-600 leading-relaxed font-medium select-text" contenteditable="true" id="rightDescText">
                            You can complete your presentation with infographic slides on various topics and designs.
                        </div>
                    </foreignObject>

                <!-- RECESSED BASE PATH TRENCH UNDERNEATH TRACK -->
                <path d="M 315 220 L 770 220 A 75 75 0 0 1 770 370 L 430 370 A 75 75 0 0 0 430 520 L 885 520" 
                      stroke="#cbd5e1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />

                <!-- VIBRANT GLOSSY SERPENTINE TRACK TUBE -->

                      stroke="url(#serpentineGradient)" 
                      stroke-width="14" 
                      stroke-linecap="round" 
                      stroke-linejoin="round"
                      fill="none" 
                      filter="url(#pathShadow)" />

                <!-- TRACK INTERMEDIATE INDICATOR BEADS -->
                <!-- Top Row Beads -->

                <circle cx="515" cy="220" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <circle cx="685" cy="220" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <!-- Arc 1 Bead -->
                <circle cx="845" cy="295" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <!-- Middle Row Beads -->
                <circle cx="685" cy="370" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <circle cx="515" cy="370" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <circle cx="360" cy="370" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <!-- Arc 2 Bead -->
                <circle cx="355" cy="445" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <!-- Bottom Row Beads -->
                <circle cx="360" cy="520" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <circle cx="515" cy="520" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <circle cx="685" cy="520" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
                <circle cx="840" cy="520" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />

                <!-- NEUMORPHIC START BADGE (TOP LEFT DIAL) -->
                <g id="startBadge" transform="translate(260, 220)" class="cursor-pointer">
                    <!-- Outer Extruded Base Disk -->
                    <circle cx="0" cy="0" r="54" fill="url(#badgeBezelGrad)" filter="url(#neuBadgeExtrude)" />
                    <!-- Recessed Concentric Ring / Groove -->
                    <circle cx="0" cy="0" r="45" fill="#e6edf5" filter="url(#neuRecessedGroove)" />
                    <!-- Raised Surface Center Button -->
                    <circle cx="0" cy="0" r="36" fill="url(#badgeSurfaceGrad)" filter="url(#neuPillExtrude)" />
                    <!-- Search Icon Graphics -->
                    <g transform="translate(0, 0) scale(0.95)">
                        <path d="M-8,-8 A12,12 0 1,1 8,8 A12,12 0 1,1 -8,-8 Z" fill="none" stroke="#2563eb" stroke-width="3" />
                        <line x1="8" y1="8" x2="16" y2="16" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />
                        <text x="0" y="4.5" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">$</text>
                    </g>
                </g>

                <!-- NEUMORPHIC END BADGE (BOTTOM RIGHT DIAL) -->
                <g id="endBadge" transform="translate(940, 520)" class="cursor-pointer">
                    <!-- Outer Extruded Base Disk -->
                    <circle cx="0" cy="0" r="54" fill="url(#badgeBezelGrad)" filter="url(#neuBadgeExtrude)" />
                    <!-- Recessed Concentric Ring / Groove -->
                    <circle cx="0" cy="0" r="45" fill="#e6edf5" filter="url(#neuRecessedGroove)" />
                    <!-- Raised Surface Center Button -->
                    <circle cx="0" cy="0" r="36" fill="url(#badgeSurfaceGrad)" filter="url(#neuPillExtrude)" />
                    <!-- Hand Holding Coin Graphic -->
                    <g transform="translate(0, -2) scale(0.9)">
                        <circle cx="4" cy="-12" r="5" fill="none" stroke="#2563eb" stroke-width="2.5" />
                        <circle cx="4" cy="-12" r="2" fill="#2563eb" />
                        <path d="M-16,8 C-16,2 -10,-1 -3,-1 L6,-1 C10,-1 14,2 17,5 L20,8 C21,9 20,11 18,11 L-2,11 C-6,11 -10,13 -13,16 L-16,16 Z" fill="#2563eb" />
                    </g>
                </g>

                <!-- MILESTONE NODE 01 -->
                <g id="nodeGroup-1" transform="translate(430, 220)">
                    <line x1="0" y1="0" x2="0" y2="-50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
                    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
                    <g class="pill-node" onclick="toggleNode(this, 'num-1')">
                        <rect x="-32" y="-84" width="64" height="34" rx="17" fill="#e6edf5" filter="url(#neuPillExtrude)" />
                        <text x="0" y="-62" text-anchor="middle" font-size="14" font-weight="800" fill="#334155" id="num-1">01</text>
                    </g>
                    <text x="0" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" class="cursor-pointer carved-title" onclick="makeEditable(this)" id="label-1">Enter Detailed Content</text>
                </g>

                <!-- MILESTONE NODE 02 (Center Inverted) -->
                <g id="nodeGroup-2" transform="translate(600, 220)">
                    <line x1="0" y1="0" x2="0" y2="50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
                    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
                    <text x="0" y="-32" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" class="cursor-pointer carved-title" onclick="makeEditable(this)" id="label-2">Enter Detailed Content</text>
                    <g class="pill-node" onclick="toggleNode(this, 'num-2')">
                        <rect x="-32" y="50" width="64" height="34" rx="17" fill="#e6edf5" filter="url(#neuPillExtrude)" />
                        <text x="0" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#334155" id="num-2">02</text>
                    </g>
                </g>

                <!-- MILESTONE NODE 03 -->
                <g id="nodeGroup-3" transform="translate(770, 220)">
                    <line x1="0" y1="0" x2="0" y2="-50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
                    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="3" />
                    <g class="pill-node" onclick="toggleNode(this, 'num-3')">

                </g>

                <!-- MILESTONE NODE 06 (Middle Track Left) -->
                <g id="nodeGroup-6" transform="translate(430, 370)">
                    <line x1="0" y1="0" x2="0" y2="-50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
                    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
                    <g class="pill-node" onclick="toggleNode(this, 'num-6')">
                        <rect x="-32" y="-84" width="64" height="34" rx="17" fill="#e6edf5" filter="url(#neuPillExtrude)" />
                        <text x="0" y="-62" text-anchor="middle" font-size="14" font-weight="800" fill="#334155" id="num-6">06</text>
                    </g>
                    <text x="0" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" class="cursor-pointer carved-title" onclick="makeEditable(this)" id="label-6">Enter Detailed Content</text>
                </g>

                <!-- MILESTONE NODE 05 (Middle Track Center Inverted) -->
                <g id="nodeGroup-5" transform="translate(600, 370)">
                    <line x1="0" y1="0" x2="0" y2="50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
                    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="3" />
                    <text x="0" y="-32" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" class="cursor-pointer carved-title" onclick="makeEditable(this)" id="label-5">Enter Detailed Content</text>
                    <g class="pill-node" onclick="toggleNode(this, 'num-5')">

                        <text x="0" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#334155" id="num-5">05</text>
                    </g>
                </g>

                <!-- MILESTONE NODE 04 (Middle Track Right) -->
                <g id="nodeGroup-4" transform="translate(770, 370)">
                    <line x1="0" y1="0" x2="0" y2="-50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
                    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#10b981" stroke-width="3" />
                    <g class="pill-node" onclick="toggleNode(this, 'num-4')">

                </g>

                <!-- MILESTONE NODE 07 (Bottom Track Left) -->
                <g id="nodeGroup-7" transform="translate(430, 520)">
                    <line x1="0" y1="0" x2="0" y2="-50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />
                    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="3" />

                <!-- MILESTONE NODE 08 (Bottom Track Center Inverted) -->

    </main>

    <!-- JAVASCRIPT INTERACTIVE LOGIC -->
    <script>
        // Inline text editor helper
        function makeEditable(element) {
            if (!element) return;
            const currentText = element.textContent.trim();
            const newText = prompt("Edit content:", currentText);
            if (newText !== null && newText.trim() !== "") {
                element.textContent = newText.trim();
            }
        }

        // Interactive node toggle to trigger pressed state or edit value
        function toggleNode(pillElement, numId) {
            const numText = document.getElementById(numId);
            if (numText) {
                makeEditable(numText);
            }
        }
    </script>
</body>
</html>
