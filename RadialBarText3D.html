<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Radial Bar Chart</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <canvas id="chartCanvas" width="1100" height="700"></canvas>
    
    <script>
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const cx = 550;
        const cy = 300;
        const scaleY = 0.5;
        const tubeRadius = 16;
        
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 26px "Segoe UI", Arial';
        ctx.textAlign = 'center';
        ctx.fillText("DATA DISTRIBUTION BY SECTOR", cx, 50);
        
        const gridRadii = [45, 91, 133, 175, 217, 259, 301, 335]; 
        
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        for (let i = 0; i < gridRadii.length - 1; i++) {
            ctx.beginPath();
            ctx.ellipse(cx, cy, gridRadii[i], gridRadii[i] * scaleY, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        ctx.fillStyle = '#333333';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        for (let i = 10; i <= 100; i += 10) {
            let angle = 0.5 * Math.PI + (i / 100) * 2 * Math.PI;
            
            let x1 = cx + gridRadii[0] * Math.cos(angle);
            let y1 = cy + gridRadii[0] * Math.sin(angle) * scaleY;
            let x2 = cx + gridRadii[gridRadii.length - 2] * Math.cos(angle);
            let y2 = cy + gridRadii[gridRadii.length - 2] * Math.sin(angle) * scaleY;
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            
            let lx = cx + gridRadii[gridRadii.length - 1] * Math.cos(angle);
            let ly = cy + gridRadii[gridRadii.length - 1] * Math.sin(angle) * scaleY;
            ctx.fillText(`${i}%`, lx, ly);
        }
        
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 8, 42, 21, 0, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = '#e8e8e8';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 4, 38, 19, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(cx - 38, cy, 76, 4);
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 38, 19, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#d0d0d0';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        ctx.fillStyle = '#e3f2fd';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 20, 10, 0, 0, Math.PI*2);
        ctx.fill();
        
        const tubes = [
            { name: "TECHNOLOGY", val: 75, R: 280, color: '#1E88E5', light: '#90CAF9', dark: '#0D47A1', textAngle: 2.25 },
            { name: "ENERGY",     val: 60, R: 238, color: '#43A047', light: '#A5D6A7', dark: '#1B5E20', textAngle: 1.95 },
            { name: "FINANCE",    val: 45, R: 196, color: '#FDD835', light: '#FFF59D', dark: '#F57F17', textAngle: 1.7 },
            { name: "HEALTHCARE", val: 30, R: 154, color: '#FB8C00', light: '#FFCC80', dark: '#E65100', textAngle: 1.48 },
            { name: "EDUCATION",  val: 20, R: 112, color: '#E53935', light: '#EF9A9A', dark: '#B71C1C', textAngle: 1.3 },
            { name: "SERVICES",   val: 10, R:  70, color: '#8E24AA', light: '#CE93D8', dark: '#4A148C', textAngle: 1.15 }
        ];
        
        tubes.forEach(tube => {
            ctx.beginPath();
            ctx.ellipse(cx, cy + 12, tube.R, tube.R * scaleY, 0, Math.PI, Math.PI + (tube.val/100)*2*Math.PI);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 32;
            ctx.lineCap = 'round';
            ctx.stroke();
        });
        
        function createSphere(r, baseColor, lightColor, darkColor) {
            const sc = document.createElement('canvas');
            sc.width = r * 2;
            sc.height = r * 2;
            const sCtx = sc.getContext('2d');
            
            const hx = r;
            const hy = r * 0.4; 
            
            const grad = sCtx.createRadialGradient(hx, hy, r * 0.05, r, r, r);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, lightColor);
            grad.addColorStop(0.7, baseColor);
            grad.addColorStop(1, darkColor);
            
            sCtx.fillStyle = grad;
            sCtx.beginPath();
            sCtx.arc(r, r, r, 0, Math.PI * 2);
            sCtx.fill();
            return sc;
        }
        
        let spheresToDraw = [];
        
        tubes.forEach(tube => {
            const sphereImg = createSphere(tubeRadius, tube.color, tube.light, tube.dark);
            const startAngle = Math.PI;
            const endAngle = Math.PI + (tube.val / 100) * 2 * Math.PI;
            
            const steps = Math.ceil(2500 * (tube.val / 100));
            
            for (let i = 0; i <= steps; i++) {
                let t = startAngle + (endAngle - startAngle) * (i / steps);
                let x = cx + tube.R * Math.cos(t);
                let y = cy + tube.R * Math.sin(t) * scaleY;
                
                spheresToDraw.push({
                    img: sphereImg,
                    x: x - tubeRadius,
                    y: y - tubeRadius,
                    z: y 
                });
            }
        });
        
        spheresToDraw.sort((a, b) => a.z - b.z);
        
        spheresToDraw.forEach(s => {
            ctx.drawImage(s.img, s.x, s.y);
        });
        
        tubes.forEach(tube => {
            ctx.save();
            ctx.font = "bold 13.5px Arial";
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 1;
            
            let angle = tube.textAngle * Math.PI;
            let tx = cx + tube.R * Math.cos(angle);
            let ty = cy + tube.R * Math.sin(angle) * scaleY - 14; 
            
            let dx = -tube.R * Math.sin(angle);
            let dy = tube.R * Math.cos(angle) * scaleY;
            let rot = Math.atan2(dy, dx);
            
            if (rot > Math.PI/2 || rot < -Math.PI/2) {
                rot += Math.PI;
            }
            
            ctx.translate(tx, ty);
            ctx.rotate(rot);
            
            let displayName = tube.name.charAt(0) + tube.name.slice(1).toLowerCase(); 
            ctx.fillText(`${displayName} ${tube.val}%`, 0, 0);
            ctx.restore();
        });
        
        const legendY = 640;
        const totalLegendWidth = tubes.length * 155;
        const startX = cx - totalLegendWidth / 2 + 20;
        
        tubes.forEach((tube, index) => {
            let lx = startX + index * 155;
            
            ctx.fillStyle = tube.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.fillRect(lx, legendY, 20, 20);
            ctx.strokeRect(lx, legendY, 20, 20);
            
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${tube.name} (${tube.val}%)`, lx + 28, legendY + 10);
        });
        
    </script>
</body>
</html>
