<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foxglove Hollow — Sign in</title>
<style>
:root{--cream:#f3e8d2;--moss:#5f7f5b;--teal:#274e52;--ochre:#d9a45b;--orange:#c8642d;--ink:#3b2b1d;--paper:#f8efdb;--paper2:#fffaf0;--shade:rgba(58,38,18,.34);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",P052,"URW Palladio L",Georgia,serif}
body.night{--paper:#e7e1ef;--paper2:#f5f2fa;--ink:#2a2644;--shade:rgba(6,6,32,.6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#ecd9b4;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;transition:background .8s}
body.night{background:#10132f}
#c{position:fixed;inset:0;display:block}
.vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 16vmin rgba(60,36,14,.22);transition:box-shadow 1.2s}
body.night .vig{box-shadow:inset 0 0 22vmin rgba(2,2,20,.55)}
.wrap{position:fixed;z-index:5;left:clamp(20px,5vw,84px);top:50%;transform:translateY(-50%);width:min(440px,calc(100vw - 40px));filter:drop-shadow(2px 10px 12px var(--shade))}
.panel{margin:0;padding:34px 36px 26px;background:var(--paper);color:var(--ink);transition:background-color 1.2s,color 1.2s;
clip-path:polygon(0 1.5%,22% 0,51% 1%,79% 0,100% 1.2%,99.4% 34%,100% 66%,99.3% 98.6%,70% 100%,41% 99%,14% 100%,0 98.8%,.6% 62%,0 30%)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand svg{width:44px;height:44px;flex:none}
.brand b{font-weight:400;font-size:34px;letter-spacing:-.01em;line-height:1}
.brand em{color:var(--orange);font-size:1.1em;margin-left:.12em}
body.night .brand em{color:#8d4a86}
.sub{margin:0 0 26px;font-size:14px;font-style:italic;color:#5b4632}
body.night .sub{color:#4a4468}
label{display:block;margin:0 0 7px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7a4e28}
body.night label{color:#5a4a86}
.field{position:relative;margin-bottom:20px;filter:drop-shadow(0 2px 2px rgba(80,50,20,.2))}
input{width:100%;padding:14px 46px 14px 15px;border:0;font:inherit;font-size:16px;color:var(--ink);background:var(--paper2);
clip-path:polygon(0 8%,30% 0,66% 5%,100% 0,99% 52%,100% 96%,68% 100%,32% 96%,0 100%,1% 50%)}
input::placeholder{color:#a8977d;font-style:italic}
input:focus{outline:none;background:linear-gradient(var(--orange),var(--orange)) bottom/100% 3px no-repeat,#fff}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--ink);cursor:pointer;padding:6px}
.eye:focus-visible,.go:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px dashed var(--orange);outline-offset:3px}
.eye svg{width:100%;height:100%}
.forgot{display:block;text-align:right;margin:-8px 0 22px;font-size:13px;font-style:italic;color:#5b4632;text-decoration:none}
.forgot:hover{color:var(--orange)}
.go{width:100%;padding:16px;border:0;background:var(--teal);color:#f8efdb;font:inherit;font-size:13px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;
clip-path:polygon(1% 8%,28% 0,63% 5%,99% 0,100% 55%,98% 97%,66% 100%,32% 96%,0 100%,1% 48%);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .4s}
.go:hover{transform:translateY(-2px) rotate(-.4deg);background:#2f5d61}
.go:active{transform:translateY(1px) scale(.99)}
body.night .go{background:#3a3f86}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.foot a{color:var(--ink);text-decoration:none}
.foot a:hover{color:var(--orange)}
.ver{padding:4px 10px;background:#e6d8b8;font-size:11px;letter-spacing:.1em;clip-path:polygon(0 12%,50% 0,100% 8%,98% 100%,48% 94%,2% 100%)}
body.night .ver{background:#cfc9e6}
.controls{position:fixed;right:clamp(18px,3.4vw,48px);bottom:clamp(18px,3.4vw,44px);z-index:6;display:flex;gap:12px}
.chip{appearance:none;display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:0;font:inherit;font-size:15px;font-style:italic;color:var(--ink);cursor:pointer;background:var(--paper);
clip-path:polygon(2% 6%,30% 0,62% 4%,99% 1%,100% 52%,98% 96%,64% 100%,34% 97%,1% 100%,0 48%);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-color 1.2s}
.chipw{filter:drop-shadow(0 4px 5px var(--shade))}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.track{position:relative;width:48px;height:24px;border-radius:12px;background:#d9c7a1;box-shadow:inset 0 2px 3px rgba(80,50,20,.3);transition:background .9s}
body.night .track{background:#3a3f86}
.knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--orange);transition:transform .7s cubic-bezier(.5,-.3,.3,1.35),background .7s}
body.night .knob{transform:translateX(24px);background:#f4ead2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:859px){
.wrap{top:auto;bottom:64px;left:50%;transform:translateX(-50%);width:calc(100vw - 28px)}
.panel{padding:24px 24px 18px}.brand b{font-size:28px}.brand svg{width:36px;height:36px}.sub{margin-bottom:16px;font-size:13px}
.field{margin-bottom:14px}input{padding:11px 44px 11px 13px}.go{padding:13px}.foot{margin-top:16px}.forgot{margin-bottom:16px}
.controls{right:50%;transform:translateX(50%);bottom:14px}}
@media (max-width:859px) and (max-height:700px){.sub{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="A paper-cut bird carries a letter to a girl on a couch. The letter drops, a ticket slips out and dissolves into her laptop, and a green notification appears." role="img"></canvas>
<div class="vig"></div>

<div class="wrap"><form class="panel" id="f" autocomplete="off">
  <div class="brand">
    <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="30" cy="12" r="8" fill="#d9a45b"/><path d="M0 34Q10 22 22 28T44 24V44H0Z" fill="#9bb89b"/><path d="M0 40Q14 30 26 36T44 33V44H0Z" fill="#5f7f5b"/><path d="M12 33 17 15 22 33ZM8 33 14 22 20 33Z" fill="#274e52"/><path d="M26 30 31 20 36 30Z" fill="#c8642d"/></svg>
    <b>Foxglove<em>Hollow</em></b>
  </div>
  <p class="sub">Sign in and the post will find you.</p>
  <label for="uid">Enter ID // Email</label>
  <div class="field"><input id="uid" name="uid" type="text" placeholder="UID // e.g. fern" required></div>
  <label for="pw">Enter password</label>
  <div class="field"><input id="pw" name="pw" type="password" placeholder="••••••••••" required>
    <button type="button" class="eye" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M4 20 20 4"/></svg></button></div>
  <a class="forgot" href="#">Forgot password?</a>
  <button class="go" id="go" type="submit">Open the post</button>
  <div class="foot"><a href="#">Request gateway access</a><span class="ver">Plate XVIII</span></div>
</form></div>

<nav class="controls" aria-label="Scene controls">
  <span class="chipw"><button type="button" class="chip" id="replay">Replay</button></span>
  <span class="chipw"><button type="button" class="chip" id="tg" aria-pressed="false"><span class="track" aria-hidden="true"><span class="knob"></span></span><span id="tl">Day</span></button></span>
</nav>
<p class="sr" aria-live="polite" id="live"></p>

<script>
(()=>{'use strict';
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const PAL={sky1:['#fbf3e1','#2c3173'],sky2:['#ecd9b4','#10132f'],far:['#dfdec3','#4a508f'],hill:['#bdcfb2','#3e4487'],ridge:['#9bb89b','#343a7c'],pine:['#5f7f5b','#24295f'],pine2:['#274e52','#1a1d4e'],
floor:['#d9a45b','#352b63'],rug:['#c9713a','#5a3766'],couch:['#274e52','#1c2b66'],couch2:['#1d3c3f','#141f4c'],cush:['#7e9c74','#3a4a96'],cush2:['#c8642d','#8a4a86'],skin:['#f3cfa6','#dcb3a6'],hair:['#3b2b1d','#1b1530'],
sweat:['#c8642d','#8a4a86'],jeans:['#6f8fa0','#3a4a8a'],lap:['#d8d2c0','#8f8bb6'],lapd:['#1b3f43','#0f1a3a'],pole:['#4a3019','#241c40'],shade:['#efc27d','#ffd57c'],
feat:['#f7f2e4','#cfc9e6'],feat2:['#e9e3d0','#b4aed4'],body:['#f1ecdc','#d6d0ea'],env:['#f8efdb','#e7e1ef'],tick:['#e8b865','#f2c97f']};
let night=0,nT=0,W,H,dpr,sc,bx,bw,by,bh,u,ox,fy,Bs,grain,px=0,py=0,tx=0,ty=0,T=0,ph=0,clock=0,last=performance.now();
const pi2=Math.PI*2,cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lp=(a,b,t)=>a+(b-a)*t,eo=t=>1-Math.pow(1-cl(t),3),eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},
eob=t=>{t=cl(t);return 1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2)};
const hx=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));
const F=k=>{const a=hx(PAL[k][0]),b=hx(PAL[k][1]);return`rgb(${a.map((v,i)=>v+(b[i]-v)*night|0).join()})`};
const hs=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const bez=(A,C,B,e)=>({x:(1-e)*(1-e)*A.x+2*(1-e)*e*C.x+e*e*B.x,y:(1-e)*(1-e)*A.y+2*(1-e)*e*C.y+e*e*B.y});
const SH=(b,o)=>{x.shadowColor=night>.5?'rgba(4,4,28,.5)':'rgba(58,38,18,.3)';x.shadowBlur=b*dpr;x.shadowOffsetY=o*dpr};
const NS=()=>{x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0};
const poly=(p)=>{x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath()};

function size(){
  dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  sc=Math.min(W,H)*.04;const wide=W>=860;
  bx=wide?W*.44:0;bw=wide?W*.56:W;by=0;bh=wide?H:H*.52;
  u=Math.min(bw/106,bh/98);ox=bx+bw*.5-8*u;fy=by+bh*(wide?.9:.94);Bs=13*u;
  const g=document.createElement('canvas');g.width=g.height=128;const gx=g.getContext('2d'),id=gx.createImageData(128,128);
  for(let i=0;i<id.data.length;i+=4){const n=Math.random();if(n<.5){id.data.set([74,52,30,(.5-n)*60],i)}else{id.data.set([255,251,240,(n-.5)*50],i)}}
  gx.putImageData(id,0,0);grain=x.createPattern(g,'repeat');
}

/* ---------- backdrop: hung sun/moon, hills, pines ---------- */
function hill(y0,amp,len,ph0,col,d,pines,ph1){
  const o=-px*d*sc,oy=-py*d*sc*.5,yy=X=>y0+oy+amp*(Math.sin(X/len+ph0)+.5*Math.sin(X/len*2.7+ph0*2));
  x.fillStyle=F(col);SH(8,-2);x.beginPath();x.moveTo(-60,H+60);
  for(let X=-60;X<=W+60;X+=12)x.lineTo(X+o,yy(X));
  x.lineTo(W+60,H+60);x.closePath();x.fill();NS();
  if(pines){x.fillStyle=F(pines);
    for(let X=-40,i=0;X<W+40;X+=pines==='pine2'?20:11,i++){
      if(Math.sin(X*.012+ph1)+Math.sin(X*.031+ph1*2)*.5<.1)continue;
      const h=H*(.05+hs(i+ph1)*.05),w=h*.5,b=yy(X)+4,xx=X+o;
      for(let k=0;k<4;k++){const t=b-h*(k*.27),wk=w*(.45+.2*k);poly([[xx,t-h*.42],[xx+wk,t],[xx-wk,t]]);x.fill()}
    }}
}
function sky(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,F('sky1'));g.addColorStop(1,F('sky2'));x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const a=night*(.4+.6*Math.abs(Math.sin(clock*.8+i)));if(a<.02)continue;x.globalAlpha=a;x.fillStyle='#fff4d6';const sx=hs(i)*W,sy=hs(i+9)*H*.45,r=1+hs(i+3)*1.6;poly([[sx,sy-r*1.6],[sx+r*.6,sy],[sx,sy+r*1.6],[sx-r*.6,sy]]);x.fill()}
  x.globalAlpha=1;
  // clouds
  x.globalAlpha=1-night;x.fillStyle='#fbf6ea';SH(6,3);
  for(const [cx,cy,s] of [[.3,.13,1],[.62,.3,.7],[.86,.4,.55]]){const X=bx+bw*cx-px*sc*.15,Y=by+bh*cy,r=Math.min(bw,bh)*.045*s;x.beginPath();for(const [a,b,c] of [[-1.6,.2,.8],[-.5,-.4,1.15],[.7,-.2,.95],[1.7,.2,.65]]){x.moveTo(X+a*r+c*r,Y+b*r);x.arc(X+a*r,Y+b*r,c*r,0,pi2)}x.rect(X-2.4*r,Y+.1*r,4.9*r,.9*r);x.fill()}
  NS();x.globalAlpha=1;
  // sun / moon on a thread
  const sx=bx+bw*.8-px*sc*.25,r=Math.min(bw,bh)*.07,len=by+bh*.17,a=Math.sin(clock*.9)*.035;
  x.save();x.translate(sx,0);x.rotate(a);x.strokeStyle='rgba(74,54,34,.5)';x.lineWidth=1;x.beginPath();x.moveTo(0,0);x.lineTo(0,len);x.stroke();x.translate(0,len);SH(7,4);
  x.globalAlpha=1-night;x.fillStyle='#c8642d';const rp=[];for(let i=0;i<44;i++){const q=i/44*pi2,k=i%2?1.12:1.38;rp.push([Math.cos(q)*r*k,Math.sin(q)*r*k])}poly(rp);x.fill();
  x.fillStyle='#d9a45b';x.beginPath();x.arc(0,0,r,0,pi2);x.fill();x.fillStyle='#e6b772';x.beginPath();x.arc(-r*.08,-r*.1,r*.7,0,pi2);x.fill();
  x.globalAlpha=night;x.fillStyle='#f5ecd6';x.beginPath();x.arc(0,0,r*1.04,0,pi2);x.fill();NS();x.fillStyle='#e3d4b3';
  for(const [a1,b1,c1] of [[-.3,-.2,.2],[.28,.2,.13],[-.1,.4,.1]]){x.beginPath();x.arc(a1*r,b1*r,c1*r,0,pi2);x.fill()}
  x.restore();x.globalAlpha=1;
}

/* ---------- the bird ---------- */
const um=p=>p<.42?p/.42*.5:.5+(p-.42)/.58*.5;       // downstroke is shorter and faster than the recovery
const nz=(a,b,c)=>{const l=Math.hypot(a,b,c)||1;return{x:a/l,y:b/l,z:c/l}};
const l3=(a,b,t)=>({x:lp(a.x,b.x,t),y:lp(a.y,b.y,t),z:lp(a.z,b.z,t)});
const pj=p=>[p.x-.5*p.z,-p.y+.16*p.z];
function feather(a,e,wd,col){
  const dx=e[0]-a[0],dy=e[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*wd/2,ny=dx/L*wd/2;
  x.beginPath();x.moveTo(a[0]+nx,a[1]+ny);x.lineTo(a[0]+dx*.6+nx*1.15,a[1]+dy*.6+ny*1.15);x.quadraticCurveTo(e[0]+nx*.4,e[1]+ny*.4,e[0],e[1]);
  x.quadraticCurveTo(e[0]-nx*.4,e[1]-ny*.4,a[0]+dx*.6-nx*1.15,a[1]+dy*.6-ny*1.15);x.lineTo(a[0]-nx,a[1]-ny);x.closePath();x.fillStyle=col;x.fill();x.stroke();
  x.save();x.strokeStyle='rgba(120,100,80,.35)';x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(a[0]+dx*.9,a[1]+dy*.9);x.stroke();x.restore();
}
function wing(side,p){
  const u0=um(p),v=-Math.sin(pi2*u0),up=Math.max(0,v);
  const b1=.1+.9*Math.cos(pi2*u0),          // arm flap angle: +57° at top, −46° at bottom
        b2=b1-.6*v,                          // hand lags: tip rises on the downstroke (curved, loaded), droops on the upstroke (arched)
        s1=.3+.3*up,s2=s1+.2+.25*up,         // sweep-back grows on the recovery so the wing slips through the air
        La=.46,Lh=.58*(1-.4*up);             // hand folds in on the upstroke: less area, less drag
  const d1=nz(-s1,Math.sin(b1),Math.cos(b1)),d2=nz(-s2,Math.sin(b2),Math.cos(b2));d1.z*=side;d2.z*=side;
  const S3={x:.12,y:.06,z:0},Wr={x:S3.x+d1.x*La,y:S3.y+d1.y*La,z:d1.z*La},T3={x:Wr.x+d2.x*Lh,y:Wr.y+d2.y*Lh,z:Wr.z+d2.z*Lh};
  const fb=nz(-1,-.25*v-.08,0);               // trailing feathers bend up under load, hang when unloaded
  const fe=(r,d,len,wd,col)=>feather(pj(r),pj({x:r.x+d.x*len,y:r.y+d.y*len,z:r.z+d.z*len}),wd,col);
  x.lineWidth=.008;x.strokeStyle='rgba(70,50,30,.4)';x.lineJoin='round';
  for(let i=8;i>=0;i--){const t=.08+.92*i/8;fe(l3(S3,Wr,t),fb,(.26+.1*Math.sin(Math.PI*t*.9))*(.75+.25*t),.075,F(i%2?'feat':'feat2'))}
  for(let i=7;i>=0;i--){const t=i/7,m=l3(fb,d2,.2+.75*t);m.y+=(t-.5)*.45*up;const d=nz(m.x,m.y,m.z);
    fe(l3(Wr,T3,.06+.88*t),d,(.5-.2*t*t)*(1-.25*up),.075,F(i%2?'feat2':'feat'))}
  for(let i=8;i>=0;i--)fe(l3(S3,Wr,.06+.9*i/8),fb,.17,.07,F('body'));
  for(let i=5;i>=0;i--){const t=i/5,m=l3(fb,d2,.3+.4*t),d=nz(m.x,m.y,m.z);fe(l3(Wr,T3,.05+.7*t),d,.16-.05*t,.065,F('body'))}
  for(let i=8;i>=0;i--)fe(l3(S3,Wr,.04+.9*i/8),fb,.09,.06,F('feat'));
  const a=pj(S3),b=pj(Wr),c=pj(T3);x.lineCap='round';x.strokeStyle=F('body');x.lineWidth=.05;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c[0],c[1]);x.stroke();
  x.strokeStyle='rgba(70,50,30,.3)';x.lineWidth=.008;x.stroke();
}
function birdBody(p,carry){
  const u0=um(p),tilt=.14*Math.sin(pi2*u0);
  x.lineWidth=.008;x.strokeStyle='rgba(70,50,30,.4)';
  for(let i=0;i<5;i++){const a=Math.PI+(i-2)*.17+tilt;feather([-.42,.05],[-.42+Math.cos(a)*.5,.05+Math.sin(a)*.5],.11,F(i%2?'feat':'feat2'))}
  if(carry){x.strokeStyle='#d98a82';x.lineWidth=.03;x.beginPath();x.moveTo(.02,.2);x.lineTo(.0,.5);x.moveTo(.13,.2);x.lineTo(.13,.5);x.stroke();x.lineWidth=.008;x.strokeStyle='rgba(70,50,30,.4)'}
  x.fillStyle=F('body');x.beginPath();x.moveTo(-.5,.02);x.bezierCurveTo(-.3,-.2,.1,-.28,.34,-.2);x.bezierCurveTo(.44,-.16,.46,-.04,.4,.06);x.bezierCurveTo(.3,.24,0,.27,-.2,.16);x.bezierCurveTo(-.34,.1,-.42,.08,-.5,.02);x.closePath();x.fill();x.stroke();
  x.beginPath();x.arc(.5,-.25,.115,0,pi2);x.fill();x.stroke();
  x.fillStyle='#d98a82';poly([[.6,-.28],[.75,-.22],[.6,-.19]]);x.fill();
  x.fillStyle='#d9a0a0';x.beginPath();x.arc(.54,-.28,.034,0,pi2);x.fill();x.fillStyle='#2b2018';x.beginPath();x.arc(.54,-.28,.02,0,pi2);x.fill();
}
const TR=4.6;
function path(t){
  const d={x:ox-17*u,y:fy-68*u};
  if(t<TR)return bez({x:bx-.1*bw,y:by+.22*bh},{x:bx+.28*bw,y:by+.03*bh},d,1-Math.pow(1-t/TR,2));
  const s=cl((t-TR)/3.6);return bez(d,{x:d.x+.1*bw,y:d.y-.22*bh},{x:bx+1.2*bw,y:by-.2*bh},s*s);
}
function pose(t){
  const p0=path(t),p1=path(t+.03),hd=Math.atan2(p1.y-p0.y,p1.x-p0.x),fl=t<TR?cl((t-3.3)/1.3):0;
  return{x:p0.x,y:p0.y,pitch:cl(hd*.7-.12-.55*fl,-.9,.5)};
}
const freq=t=>t<3.4?2.2:t<TR?lp(2.2,3.4,(t-3.4)/1.2):t<5.6?3.2:2.5;
function drawBird(t){
  const p=pose(t),carry=t<TR,bob=-.07*Bs*Math.sin(pi2*um(ph));
  x.save();x.translate(p.x,p.y+bob);x.rotate(p.pitch);x.scale(Bs,Bs);SH(4,2);
  wing(-1,ph);birdBody(ph,carry);wing(1,ph);x.restore();NS();
  return{x:p.x+Bs*(.06*Math.cos(p.pitch)-.5*Math.sin(p.pitch)),y:p.y+bob+Bs*(.06*Math.sin(p.pitch)+.5*Math.cos(p.pitch)),rot:p.pitch*.5};
}

/* ---------- mail, ticket, dissolve ---------- */
function ticket(cx,cy,rot,w,al,sx){
  x.save();x.globalAlpha=al;x.translate(cx,cy);x.rotate(rot);x.scale(sx||1,1);const h=w*.5;SH(4,2);
  x.fillStyle=F('tick');x.beginPath();x.roundRect(-w/2,-h/2,w,h,w*.05);x.fill();NS();x.strokeStyle='rgba(70,50,30,.4)';x.lineWidth=1;x.stroke();
  x.setLineDash([w*.03,w*.03]);x.beginPath();x.moveTo(-w*.2,-h*.42);x.lineTo(-w*.2,h*.42);x.stroke();x.setLineDash([]);
  x.fillStyle='#c8642d';x.beginPath();x.arc(-w*.34,0,w*.07,0,pi2);x.fill();x.fillStyle='rgba(255,250,235,.7)';x.fillRect(-w*.1,-h*.2,w*.5,h*.1);x.fillRect(-w*.1,h*.02,w*.36,h*.1);
  x.restore();
}
function envelope(cx,cy,rot,w,slide,al){
  x.save();x.globalAlpha=al;x.translate(cx,cy);x.rotate(rot);const h=w*.66;
  if(slide>0)ticket(0,h*(.12-1.02*eo(slide)),0,w*.62,1);
  SH(5,3);x.fillStyle=F('env');x.fillRect(-w/2,-h/2,w,h);NS();x.strokeStyle='rgba(70,50,30,.4)';x.lineWidth=1;x.strokeRect(-w/2,-h/2,w,h);
  x.beginPath();x.moveTo(-w/2,-h/2);x.lineTo(0,h*.08);x.lineTo(w/2,-h/2);x.moveTo(-w/2,h/2);x.lineTo(-w*.12,h*.05);x.moveTo(w/2,h/2);x.lineTo(w*.12,h*.05);x.stroke();
  x.fillStyle='#c8642d';x.beginPath();x.arc(0,h*.08,w*.08,0,pi2);x.fill();x.restore();
}
const scr=(a,b)=>({x:ox+a*u,y:fy+b*u});
const TS=6.1,TL=7.6;                      // ticket leaves the envelope, ticket reaches the screen
function mail(t){
  const d={x:ox-17*u,y:fy-68*u},w=11.5*u,k=1.8;
  let E,tau=t-TR;
  if(t<TR){E=pose(t);const f=drawBird(t);envelope(f.x,f.y+w*.2,f.rot,w,0,1);return}
  drawBird(t);
  const y0=d.y+Bs*.5,dy=16*u*(tau-(1-Math.exp(-k*tau))/k),sway=Math.sin(tau*3.1)*3.2*u*Math.exp(-tau*.2),
        ex=d.x+.06*Bs-14*u*cl(tau/4.6)+sway,ey=Math.min(y0+dy,fy+u),land=y0+dy>=fy+u,er=land?.25:Math.cos(tau*3.1)*.5*Math.exp(-tau*.2);
  const al=t<9.6?1:cl(1-(t-9.6)/1.8),slide=cl((t-5.5)/(TS-5.5));
  const ownsTicket=t<TS;
  if(al>0)envelope(ex,ey,er,w,ownsTicket?slide:1,al);
  if(t>=TS&&t<TL){
    const tauS=TS-TR,eS=scr(0,0);
    const sx=d.x+.06*Bs-14*u*cl(tauS/4.6)+Math.sin(tauS*3.1)*3.2*u*Math.exp(-tauS*.2),
          sy=Math.min(d.y+Bs*.5+16*u*(tauS-(1-Math.exp(-k*tauS))/k),fy+u)-w*.66*.9,
          P0={x:sx,y:sy},P1=scr(-18.5,-31.9),C={x:P0.x-9*u,y:P0.y-5*u},e=eio((t-TS)/(TL-TS)),q=bez(P0,C,P1,e);
    ticket(q.x,q.y,lp(Math.sin(e*3)*.5,-.04,e),lp(w*.62,5.6*u,e),1,lp(1,.8,e));
  }
  // dissolve into the laptop screen
  if(t>=TL&&t<TL+1.1){
    const e=(t-TL)/1.1,P1=scr(-18.5,-31.9),tw=5.6*u;
    for(let i=0;i<30;i++){
      const sx=P1.x+(hs(i)-.5)*tw*.9,sy=P1.y+(hs(i+40)-.5)*tw*.4,dl=hs(i+80)*.4,m=cl((e-dl)/(1-dl));
      const tx2=P1.x+(hs(i+120)-.5)*8*u,ty2=P1.y+(hs(i+160)-.5)*7*u;
      x.globalAlpha=1-m;x.fillStyle=i%3?F('tick'):'#7fe0a0';const s=u*(.55-.4*m);
      x.fillRect(lp(sx,tx2,eo(m))-s/2,lp(sy,ty2,eo(m))-s/2-Math.sin(m*Math.PI)*3*u,s,s);
    }x.globalAlpha=1;
  }
}

/* ---------- the room ---------- */
function rr(a,b,w,h,r,col){x.fillStyle=F(col);x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function quad(p,col){x.fillStyle=col;poly(p);x.fill()}
function room(t){
  // floor + rug
  x.fillStyle=F('floor');SH(10,-3);x.beginPath();x.moveTo(-60,H+60);for(let X=-60;X<=W+60;X+=16)x.lineTo(X,fy-2.5*u+Math.sin(X*.011)*u*.5);x.lineTo(W+60,H+60);x.fill();NS();
  x.fillStyle=F('rug');x.beginPath();x.ellipse(ox+4*u,fy+4*u,52*u,4.2*u,0,0,pi2);x.fill();
  x.save();x.translate(ox,fy);x.scale(u,u);x.lineWidth=.35;x.strokeStyle='rgba(70,50,30,.3)';
  SH(8,3);rr(-36,-41,72,32,6,'couch');NS();
  rr(-37,-22,74,14,4,'couch2');
  for(const lx of [-34,30]){x.fillStyle=F('pole');x.fillRect(lx,-9,3,8)}
  rr(-33,-24,66,8,4,'cush');
  rr(19,-40,12,12,3,'cush2');
  // girl (faces left, looking down at her laptop)
  x.lineCap='round';x.lineJoin='round';
  x.strokeStyle=F('jeans');x.lineWidth=6;x.beginPath();x.moveTo(11,-26);x.lineTo(-12,-25);x.lineTo(-13,-7);x.stroke();
  x.fillStyle='#efe3c9';x.beginPath();x.ellipse(-15,-3.6,4.6,2.4,0,0,pi2);x.fill();
  poly([[15,-25],[13,-39],[5,-42],[1,-37],[3,-25]]);x.fillStyle=F('sweat');x.fill();x.strokeStyle=F('sweat');x.lineWidth=2;x.stroke();
  x.fillStyle=F('hair');x.beginPath();x.arc(8,-48.5,6,0,pi2);x.fill();x.beginPath();x.arc(10.5,-56,2.8,0,pi2);x.fill();
  x.fillStyle='#f2c47f';x.fillRect(8.8,-54.2,3.4,1.4);
  x.fillStyle=F('skin');x.beginPath();x.arc(4,-48,5.2,0,pi2);x.fill();poly([[-1.2,-48.5],[-3.3,-46.5],[-1,-45.4]]);x.fill();
  x.fillStyle=F('hair');x.beginPath();x.ellipse(5.2,-51.4,6.1,3.6,-.25,Math.PI,pi2);x.fill();
  x.fillStyle='#2b2018';x.beginPath();x.arc(1.1,-48.3,.7,0,pi2);x.fill();
  // laptop on her lap
  quad([[-28,-22],[-7,-23],[-5,-21],[-26,-20]],F('lap'));x.stroke();
  const sq=[[-28,-22.4],[-8.5,-23.4],[-9.5,-42],[-30,-40.4]];quad(sq,F('lap'));x.stroke();
  quad([[-27.2,-23.2],[-9.4,-24.1],[-10.2,-40.8],[-28.7,-39.4]],F('lapd'));
  x.strokeStyle='rgba(255,250,235,.28)';x.lineWidth=.5;for(let i=0;i<3;i++){x.beginPath();x.moveTo(-26+i*.3,-37+i*3.6);x.lineTo(-14-i*2,-37.5+i*3.6);x.stroke()}
  const got=t>TL+.5;
  if(got){x.fillStyle='rgba(127,224,160,.9)';quad([[-26.4,-28],[-11.2,-28.8],[-11.4,-31.2],[-26.6,-30.4]],'rgba(127,224,160,.85)')}
  const gl=t>TL?Math.max(cl(1-(t-TL-.8)/1.6)*.9,got?.18:0):0;
  if(gl>0){quad(sq,`rgba(150,255,190,${gl*.7})`)}
  // girl's arm over the keys, then couch arms and the lamp
  x.strokeStyle=F('sweat');x.lineWidth=3.6;x.beginPath();x.moveTo(5,-38);x.lineTo(1,-30);x.lineTo(-8,-24.6);x.stroke();
  x.fillStyle=F('skin');x.beginPath();x.arc(-9,-24,1.9,0,pi2);x.fill();
  SH(4,2);rr(-43,-29,11,23,5,'couch');rr(32,-29,11,23,5,'couch');NS();
  x.fillStyle=F('pole');x.beginPath();x.ellipse(52,-1,6.5,1.6,0,0,pi2);x.fill();x.fillRect(51.3,-52,1.4,51);
  SH(5,2);x.fillStyle=F('shade');poly([[48,-66],[56,-66],[60,-50],[44,-50]]);x.fill();NS();
  x.fillStyle='rgba(200,100,45,.35)';poly([[51,-66],[53,-66],[53.6,-50],[50.4,-50]]);x.fill();
  x.fillStyle='rgba(200,100,45,.5)';for(let i=0;i<6;i++){poly([[44+i*2.7,-50],[46.5+i*2.7,-50],[45.2+i*2.7,-47.5]]);x.fill()}
  x.restore();
  if(night>.02){ // lamp glow
    x.save();x.globalCompositeOperation='lighter';const L=scr(52,-55),g=x.createRadialGradient(L.x,L.y,0,L.x,L.y,46*u);
    g.addColorStop(0,`rgba(255,214,130,${.55*night})`);g.addColorStop(.4,`rgba(255,190,100,${.16*night})`);g.addColorStop(1,'rgba(255,190,100,0)');x.fillStyle=g;x.fillRect(L.x-50*u,L.y-50*u,100*u,100*u);x.restore();
  }
}
function toast(t){
  const s=eob((t-8.1)/.5)*(t<13.6?1:cl(1-(t-13.6)/.8));if(t<8.1||s<=0)return;
  x.save();x.translate(ox-18.5*u,fy-47*u);x.scale(u*s,u*s);SH(4,2);x.fillStyle='#3f9e5a';x.beginPath();x.roundRect(-17,-11,34,9.5,2.4);x.fill();
  poly([[-3,-1.5],[3,-1.5],[0,2.2]]);x.fill();NS();x.fillStyle='#f4fff5';x.textAlign='center';x.textBaseline='middle';x.font='italic 3.3px Georgia,serif';x.fillText('✓  New ticket arrived',0,-6.2);x.restore();
}

/* ---------- frame ---------- */
const LOOP=16.5;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(rm){T=11}else{T+=dt;if(T>LOOP){T-=LOOP;ph=0}ph=(ph+dt*freq(T))%1}
  night+=(nT-night)*(1-Math.exp(-dt*2.2));
  const k=1-Math.exp(-dt*3.4);
  if(!drag&&!ptrOn){tx=Math.sin(clock*.19)*.42;ty=Math.sin(clock*.13+1)*.18}
  px+=(tx-px)*k;py+=(ty-py)*k;
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  sky();
  hill(H*.46,H*.035,W*.2,1.2,'far',.1);
  hill(H*.56,H*.03,W*.11,2.4,'hill',.2,'ridge',.3);
  hill(H*.64,H*.018,W*.14,.7,'ridge',.35,'pine',1.7);
  hill(H*.72,H*.012,W*.09,4,'pine',.5,'pine2',3.1);
  x.save();x.translate(-px*.7*sc,-py*.7*sc*.5);
  room(T);mail(T);toast(T);
  x.restore();
  x.globalAlpha=lp(.5,.28,night);x.fillStyle=grain;x.fillRect(0,0,W,H);x.globalAlpha=1;
}
let drag=false,ptrOn=false,pT=0;
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){tx=cl((e.clientX/W-.5)*2,-1,1);ty=cl((e.clientY/H-.5)*2,-1,1);ptrOn=true;clearTimeout(pT);pT=setTimeout(()=>ptrOn=false,3500)}});

/* ---------- ui ---------- */
const live=$('live'),tg=$('tg');
tg.onclick=()=>{const on=!document.body.classList.contains('night');document.body.classList.toggle('night',on);nT=on?1:0;tg.setAttribute('aria-pressed',on);$('tl').textContent=on?'Night':'Day';live.textContent=on?'Night falls, the lamp glows.':'Morning returns.'};
const replay=()=>{T=0;ph=0;live.textContent='A bird is bringing the post.'};
$('replay').onclick=replay;
$('eye').onclick=()=>{const p=$('pw'),s=p.type==='password';p.type=s?'text':'password';$('slash').style.display=s?'none':'';$('eye').setAttribute('aria-label',s?'Hide password':'Show password')};
$('f').onsubmit=e=>{e.preventDefault();replay();const b=$('go');b.textContent='Sealing the envelope…';setTimeout(()=>b.textContent='Open the post',2600)};
addEventListener('keydown',e=>{if(/INPUT|BUTTON|A/.test(e.target.tagName))return;if(e.key==='n'||e.key==='N')tg.click();if(e.key==='r'||e.key==='R')replay()});
addEventListener('resize',size);
size();requestAnimationFrame(frame);
})();
</script>
