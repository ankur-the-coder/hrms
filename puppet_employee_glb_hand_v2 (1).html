<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Puppet Employee</title>
<style>
:root{--ink:#f1e3c4;--panel:rgba(9,38,70,.72);--line:rgba(241,227,196,.28);color-scheme:dark}
html,body{margin:0;height:100%;background:#124f8c;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:262px;padding:12px 14px 11px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(6px);font-size:13px;line-height:1.35;transition:opacity .35s}
#ui.off{opacity:0;pointer-events:none}
#ui .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#ui b{font-weight:700;font-variant-numeric:tabular-nums}
#q{width:100%;margin:2px 0 8px;accent-color:#e2561a}
#q:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#info{opacity:.82;font-size:12px;font-variant-numeric:tabular-nums}
#ui .ticks{display:flex;justify-content:space-between;font-size:10px;opacity:.55;margin:-6px 0 9px;letter-spacing:.02em}
#ui input[type=range]{width:100%;margin:2px 0 8px;accent-color:#e2561a}
#swap{width:100%;margin:0 0 10px;padding:7px 8px;font:inherit;font-size:12px;color:var(--ink);background:rgba(241,227,196,.1);border:1px solid var(--line);border-radius:3px;cursor:pointer}
#swap:hover{background:rgba(241,227,196,.2)}#swap:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hint{opacity:.55;font-size:11px;margin-top:5px}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui" role="group" aria-label="Render quality">
  <div class="row"><span>Render quality</span><b id="qv">65</b></div>
  <input id="q" type="range" min="1" max="100" value="65" aria-label="Render quality">
  <button id="swap" type="button">Person: Realistic · tap to swap</button>
  <div class="row"><span>Pace</span><b><span id="gait">Walk</span> · <span id="spdv">1.0×</span></b></div>
  <input id="spd" type="range" min="0" max="100" value="25" aria-label="Walking speed">
  <div class="ticks"><span>stroll</span><span>walk</span><span>jog</span><span>run</span><span>sprint</span></div>
  <div id="info"></div>
  <div id="hint">Press H to hide this panel</div>
</div>

    float hl=max(max(orangeness(texture2D(uFG,vUv+vec2(o.x,0.))),orangeness(texture2D(uFG,vUv-vec2(o.x,0.)))),max(orangeness(texture2D(uFG,vUv+vec2(0.,o.y))),orangeness(texture2D(uFG,vUv-vec2(0.,o.y)))));

const v3=new THREE.Vector3();
function toDesign(o){o.getWorldPosition(v3);v3.project(fgCam);return [(camL+(v3.x+1)/2*(camR-camL))*U,(1-(v3.y+1)/2)*DH]}
function drawGlyphString(x,S,E,seed,t,slack,detail){

    else{x.fillStyle='#f3e6c6';x.fillRect(-2,-4,4,8)}x.restore()}}
/* One stable, ordered tether per digit keeps the letter chains from crossing. */
const stringBindings=[
  {finger:0,target:'wF',back:true,offset:0},{finger:2,target:'shF',back:true,offset:0},
  {finger:3,target:'headN',back:false,offset:0},{finger:1,target:'shN',back:false,offset:0},

/* ======================= WALK / POSE (employee gait from the zip) ======================= */
/* foot state relative to the hip column for leg phase p (0 = heel strike). x forward, y above ground */
function foot(p){
  const {S,beta}=WALK,X0=-.1+S*beta*.48,a=LEG.ankle,hx=q=>X0-S*q,bk=beta/.62,q1=.12*bk*(1-WALK.run*.7),q2=.38*bk;
  const stance=q=>{
    if(q<q1){const k=q/q1,pitch=.26*(1-(1-(1-k)*(1-k))),hX=hx(q);return {x:hX+.11*Math.cos(pitch)-a*Math.sin(pitch),y:a*Math.cos(pitch)+.11*Math.sin(pitch),pitch,toe:0}}
    if(q<q2)return {x:hx(q)+.11,y:a,pitch:0,toe:0};

let hMean=0;
/* pace: one parameter (body speed v) drives cadence, stride, duty factor and posture, walk -> run */
const PACE=[[0,.35],[25,1.05],[50,2.0],[75,3.2],[100,4.6]];
const paceV=x=>{let i=0;while(i<PACE.length-2&&x>PACE[i+1][0])i++;const a=PACE[i],b=PACE[i+1];return lerp(a[1],b[1],(x-a[0])/(b[0]-a[0]))};

  const Tw=1.12*Math.pow(1.05/v,.55),Tr=.74*Math.pow(2.6/v,.28);WALK.T=lerp(Tw,Tr,R);

/* ======================= QUALITY / LAYOUT ======================= */
const Q={v:65},qEl=document.getElementById('q'),qv=document.getElementById('qv'),info=document.getElementById('info');

/* ======================= LOOP ======================= */
const fixedT=params.has('t')?+params.get('t'):null;let T0=performance.now(),fpsN=0,fpsT=T0;

  const t=fixedT!==null?fixedT:(now-T0)/1000,dt=clamp(t-TIME.t,0,.1);TIME.t=t;
  if(fixedT!==null){TIME.ph=t/WALK.T;TIME.rot=-t*WALK.v*curSC*Math.SQRT1_2/CIRC.R}else{TIME.ph+=dt/WALK.T;TIME.rot-=dt*WALK.v*curSC*Math.SQRT1_2/CIRC.R}

  fgScene.updateMatrixWorld(true);
  clouds.forEach(c=>c.position.y=c.userData.y0+Math.sin(t*.35+c.userData.ph)*.035);
  /* foot + body shadows on the ground */
  const proj=(o,gy)=>{o.getWorldPosition(v3);v3.y=gy;v3.project(fgCam);return [camL+(v3.x+1)/2*(camR-camL),(v3.y+1)/2*WH]};
  legs.forEach((L,i)=>{const p=proj(L.an,GY);const lift=Math.max(0,L.an.getWorldPosition(v3).y-GY-LEG.ankle);shadows[i].position.set(p[0]+.14,p[1]-.02,0);
    shadows[i].scale.set(.62*(1-lift*.8),.14*(1-lift*.8),1);shadows[i].material.opacity=.62*(1-lift*1.8)});
  shadows[2].position.set(GX+.62,GY-.1,0);shadows[2].scale.set(1.9,.34,1);shadows[2].material.opacity=.38;

    info.textContent=`${Q.w}×${Q.h} · ${Q.ms?Q.ms+'× MSAA':'no MSAA'} · shadows ${Q.sh} · ${fps.toFixed(0)} fps`}
