<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toroid Donut — Loading Animations Test</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#ffffff}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;font-family:-apple-system,Segoe UI,Roboto,sans-serif;
  }
  #stage{
    position:relative;
    width:min(92vw,700px);
    height:min(92vw,520px);
  }
  canvas#donutCanvas{display:block;width:100%!important;cursor:pointer}

  #controls{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    z-index:10;
  }
  #replayBtn{
    font-family:inherit;font-size:.8rem;font-weight:700;color:#fff;
    background:#2a5ce0;border:none;border-radius:999px;padding:7px 16px;
    cursor:pointer;transition:transform .15s,opacity .15s;
  }
  #replayBtn:hover{opacity:.9;transform:scale(1.04)}
  #replayBtn:active{transform:scale(.97)}
</style>
</head>
<body>

<div id="controls">
  <button id="replayBtn">Replay ↻</button>
</div>

<div id="stage">
  <canvas id="donutCanvas" height="460"></canvas>
</div>

<script>
/* ── DATA (proportions only — drives segment sizes) ── */
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PAID=[8,6,10,7,12,9,14,11,8,6,10,13];
const UNPD=[3,2,4,3,5,4,6,4,3,2,4,5];
const totalDays=PAID.reduce((a,b)=>a+b,0)+UNPD.reduce((a,b)=>a+b,0);
const COL={paid:'#0aa878',unpaid:'#2a5ce0'};

let dRot=0,hovDonutIdx=null,introRAF=null,idleRAF=null;
let lastDonutSegs=[],lastDonutCx=0,lastDonutCy=0,lastDonutR=0,lastDonutr=0,lastDonutTilt=0.52;

/* ── easing library ── */
const EASE={
  outCubic:t=>1-Math.pow(1-t,3),
  outBack:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  outElastic:t=>{const c4=(2*Math.PI)/3;return t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1}
};

function hexRGB(hex){const h=hex.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

const dC=document.getElementById('donutCanvas');
const dX=dC.getContext('2d');

/* always maximum smoothness — no toggle */
const RING_STEPS=360, TUBE_STEPS=64;

function setupCanvas(canvas,ctx,h){
  const w=canvas.offsetWidth||700;
  canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;canvas.style.height=h+'px';
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,w,h);
  return w;
}

/* ── core torus renderer (shared by every animation mode) ── */
function drawTorus(ctx,cx,cy,R,r,tilt,rot,segs,progress,hoverIdx,wave,segScale){
  const PI2=Math.PI*2;
  const lightDir={x:0.4,y:-0.6,z:0.7};
  const cosTilt=Math.cos(tilt),sinTilt=Math.sin(tilt);
  const rgbCache={};
  segs.forEach(s=>{if(!rgbCache[s.color])rgbCache[s.color]=hexRGB(s.color)});

  const quads=[];
  for(let si=0;si<RING_STEPS;si++){
    const a0=PI2*si/RING_STEPS,a1=PI2*(si+1)/RING_STEPS,aMid=(a0+a1)/2;
    let segIdx=segs.length-1;
    for(let s=0;s<segs.length;s++){if(aMid*progress>=segs[s].aStart&&aMid*progress<segs[s].aEnd){segIdx=s;break}}
    const ca=aMid+rot,depth3=R*Math.sin(ca)*cosTilt;
    quads.push({a0,a1,depth:depth3,segIdx});
  }
  quads.sort((a,b)=>a.depth-b.depth);

  const phiCos=[],phiSin=[];
  for(let k=0;k<TUBE_STEPS;k++){const phi=PI2*k/TUBE_STEPS;phiCos.push(Math.cos(phi));phiSin.push(Math.sin(phi))}

  quads.forEach(q=>{
    const {a0,a1,segIdx}=q;
    const progFrac=EASE.outCubic(Math.min(1,progress));
    if(a0*progFrac>PI2) return;
    const factor=segScale?segScale[segIdx]:1;
    if(factor<=0.001) return;

    const seg=segs[segIdx];
    const isHover=hoverIdx!=null&&segIdx===hoverIdx;
    let rEff=(isHover?r*1.32:r)*factor;
    const Reff=isHover?R+9:R;
    if(wave) rEff*=1+wave.amp*Math.sin(wave.freq*((a0+a1)/2)+wave.phase);

    const top=[],bot=[];
    for(const ta of[a0,a1]){
      const cosA=Math.cos(ta+rot),sinA=Math.sin(ta+rot);
      const arr=ta===a0?top:bot;
      for(let k=0;k<TUBE_STEPS;k++){
        const cosP=phiCos[k],sinP=phiSin[k];
        const rad=Reff+rEff*cosP,x3=rad*cosA,y3raw=rad*sinA,z3=rEff*sinP;
        arr.push({x:cx+x3,y:cy+y3raw*cosTilt+z3*sinTilt});
      }
    }

    const ca=((a0+a1)/2+rot);
    const [r1,g1,b1]=rgbCache[seg.color];
    const ambient=isHover?0.55:0.42;

    for(let k=0;k<TUBE_STEPS;k++){
      const k2=(k+1)%TUBE_STEPS,phiMid=PI2*(k+.5)/TUBE_STEPS;
      const localNx=Math.cos(phiMid)*Math.cos(ca);
      const localNy=Math.cos(phiMid)*Math.sin(ca)*cosTilt+Math.sin(phiMid)*sinTilt;
      const ld=Math.max(0,localNx*lightDir.x+localNy*lightDir.y);
      let ll=ambient+0.62*ld,ls=Math.pow(ld,6)*0.45;
      if(isHover){ll*=1.15;ls*=1.3}
      const lr=Math.min(255,Math.round(r1*ll+ls*255));
      const lg2=Math.min(255,Math.round(g1*ll+ls*255));
      const lb=Math.min(255,Math.round(b1*ll+ls*255));
      ctx.beginPath();
      ctx.moveTo(top[k].x,top[k].y);ctx.lineTo(top[k2].x,top[k2].y);
      ctx.lineTo(bot[k2].x,bot[k2].y);ctx.lineTo(bot[k].x,bot[k].y);
      ctx.closePath();ctx.fillStyle=`rgb(${lr},${lg2},${lb})`;ctx.fill();
    }
  });
}

function renderDonut(p){
  const {ang=1,sc=1,tf=1,op=1,rot=dRot,wave=null,segScale=null}=p;
  const w=setupCanvas(dC,dX,460);
  const cx=w/2,cy=230,tilt=0.52;
  const R=130*sc,r=44*sc*tf;
  const PI2=Math.PI*2;
  const segs=[];let acc=0;
  MO.forEach((m,i)=>{
    const pFrac=PAID[i]/totalDays,uFrac=UNPD[i]/totalDays;
    segs.push({aStart:acc,aEnd:acc+PI2*pFrac,color:COL.paid,idx:i});acc+=PI2*pFrac;
    segs.push({aStart:acc,aEnd:acc+PI2*uFrac,color:COL.unpaid,idx:i});acc+=PI2*uFrac;
  });
  dX.save();dX.globalAlpha=Math.max(0,Math.min(1,op));
  drawTorus(dX,cx,cy,R,r,tilt,rot,segs,ang,hovDonutIdx,wave,segScale);
  dX.restore();
  lastDonutSegs=segs;lastDonutCx=cx;lastDonutCy=cy;lastDonutR=R;lastDonutr=r;lastDonutTilt=tilt;
}

/* ── segment cascade parameter curve (each of 24 segments pops in, staggered) ── */
function computeParams(t){
  const segScale=[];
  for(let i=0;i<24;i++) segScale.push(Math.max(0,EASE.outBack(Math.max(0,Math.min(1,(t*28-i)/3)))));
  return {ang:1,sc:1,tf:1,op:1,rot:0,segScale};
}

const CASCADE_DURATION=950; /* faster than the original 1900ms */

function cancelAll(){if(introRAF){cancelAnimationFrame(introRAF);introRAF=null}if(idleRAF){cancelAnimationFrame(idleRAF);idleRAF=null}}

function startIntro(){
  cancelAll();hovDonutIdx=null;
  const t0=performance.now();
  function frame(now){
    const t=Math.min(1,(now-t0)/CASCADE_DURATION);
    renderDonut(computeParams(t));
    if(t<1) introRAF=requestAnimationFrame(frame); else startIdle();
  }
  introRAF=requestAnimationFrame(frame);
}
function startIdle(){
  function frame(){
    if(hovDonutIdx===null) dRot+=0.003;
    renderDonut({ang:1,sc:1,tf:1,op:1,rot:dRot});
    idleRAF=requestAnimationFrame(frame);
  }
  idleRAF=requestAnimationFrame(frame);
}

/* ── hover hit-test (active once idle) ── */
function donutHitTest(mx,my){
  if(!lastDonutSegs.length) return null;
  const cosTilt=Math.cos(lastDonutTilt);
  const dx=mx-lastDonutCx,dy=(my-lastDonutCy)/cosTilt;
  const radial=Math.hypot(dx,dy);
  if(radial<lastDonutR-lastDonutr*1.6||radial>lastDonutR+lastDonutr*1.6) return null;
  const PI2=Math.PI*2;let ang=Math.atan2(dy,dx)-dRot;ang=((ang%PI2)+PI2)%PI2;
  for(let i=0;i<lastDonutSegs.length;i++){const s=lastDonutSegs[i];if(ang>=s.aStart&&ang<s.aEnd) return i}
  return null;
}
dC.addEventListener('mousemove',e=>{
  const rect=dC.getBoundingClientRect();
  const idx=donutHitTest(e.clientX-rect.left,e.clientY-rect.top);
  if(idx!==hovDonutIdx) hovDonutIdx=idx;
});
dC.addEventListener('mouseleave',()=>{hovDonutIdx=null});

/* ── controls ── */
const replayBtn=document.getElementById('replayBtn');
replayBtn.addEventListener('click',startIntro);
window.addEventListener('resize',()=>renderDonut({ang:1,sc:1,tf:1,op:1,rot:dRot}));

startIntro();
</script>
</body>
</html>
