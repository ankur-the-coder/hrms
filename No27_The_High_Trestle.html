/* ---------- weather presets ---------- */

const WK=['fd','stars','moon','sun','sy','cover','ki','hemi','rain','lamp','exp','teal'],WC=['top','hor','fog','cloud','key','hs','hg','tint'];

const W={};for(const k of WK)W[k]=P.night[k];for(const k of WC)W[k]=P.night[k].clone();let wx='night';
const moonDir=V3(.55,.28,-.75).normalize(),sunDir=V3(.8,.3,-.55).normalize();
const U={t:{value:0},moonDir:{value:moonDir},sunDir:{value:sunDir},top:{value:C(0)},hor:{value:C(0)},fogCol:{value:C(0)},cloudTint:{value:C(0)},stars:{value:0},moon:{value:0},sun:{value:0},cover:{value:.5},flash:{value:0},fd:{value:.001},scroll:{value:0},amb:{value:C(0)},keyCol:{value:C(0)},keyDir:{value:V3(0,1,0)},flow:{value:1},pr:{value:500}};

/* ---------- shared GLSL ---------- */
const NOISE=`float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1)),f.x),f.y);}

const SKYF=`uniform float t,stars,moon,sun,cover,flash;uniform vec3 moonDir,sunDir,top,hor,cloudTint;`+NOISE+`
vec3 sky(vec3 d){float y=max(d.y,0.);vec3 c=mix(hor,top,pow(y,.5));
vec3 p=d*170.,ci=floor(p);float h=fract(sin(dot(ci,vec3(12.9,78.2,37.7)))*43758.5);
c+=vec3(.8,.9,1.)*step(.992,h)*(1.-smoothstep(0.,.45,length(fract(p)-.5)))*stars*smoothstep(.04,.3,d.y);

vec3 cc=cloudTint*(.35+.65*lit)+vec3(1.,.8,.55)*edge*.5*sun+vec3(.6,.8,1.)*edge*.4*moon;
c=mix(c,cc,c1*smoothstep(0.,.06,d.y)*.92);}

const TERR=`uniform float scroll;float rz(float x){return 50.*sin(x*.011)+22.*sin(x*.029+1.7);}

float hill=fbm(vec2(x,z)*.012)*22.+fbm(vec2(x,z)*.04)*5.;
float h=3.+hill*smoothstep(10.,110.,dr)+smoothstep(14.,90.,dr)*7.+smoothstep(180.,420.,abs(z))*40.;

/* ---------- helpers ---------- */
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const M=(c,r=.8,m=0,e=0,ei=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,envMapIntensity:.8,emissive:e,emissiveIntensity:ei,side:THREE.DoubleSide});

const cylY=(r,l,m,x,y,z,p,r2,s=16)=>mk(new THREE.CylinderGeometry(r2??r,r,l,s),m,x,y,z,p);

/* ---------- the high trestle bridge ---------- */
function weather(m){m.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vLP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvLP=position;\n#ifdef USE_INSTANCING\nvLP+=instanceMatrix[3].xyz;\n#endif');
sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vLP;\n'+NOISE).replace('#include <color_fragment>','#include <color_fragment>\nfloat rn=fbm(vLP.xz*.15+vLP.y*.08),st=vn(vec2((vLP.x+vLP.z)*3.,vLP.y*.12)),rs=clamp(smoothstep(.38,.7,rn)*.85+smoothstep(.6,.92,st)*.6,0.,1.);\nvec3 rc=mix(vec3(.36,.15,.06),vec3(.58,.28,.1),vn(vLP.xz*2.+vLP.y));diffuseColor.rgb=mix(diffuseColor.rgb*(.8+.4*vn(vLP.xz*5.)),rc,rs);')};return m}
const STEEL=weather(M(0x2c2824,.75,.2)),TIEM=M(0x2b2018,.95),BAL=M(0x4a4540,1),RAIL=M(0x6a4a30,.5,.3);

const ties=new THREE.InstancedMesh(rbox(.32,.2,3.1,.03),TIEM,1200),posts=new THREE.InstancedMesh(rbox(.3,3.3,.5,.03),STEEL,680),dm=new THREE.Object3D();
for(let i=0;i<1200;i++){dm.position.set((i-600)*.65,DK-.32,0);dm.updateMatrix();ties.setMatrixAt(i,dm.matrix)}
for(let i=0;i<340;i++)for(const s of[0,1]){dm.position.set((i-170)*3.5,DK-1.55,s?2.75:-2.75);dm.updateMatrix();posts.setMatrixAt(i*2+s,dm.matrix)}
const hp=new THREE.InstancedMesh(new THREE.BoxGeometry(.07,.9,.07),RAIL,680);for(let i=0;i<340;i++)for(const q of[0,1]){dm.position.set((i-170)*3.5,DK+.55,q?2.45:-2.45);dm.updateMatrix();hp.setMatrixAt(i*2+q,dm.matrix)}

const hiB=new THREE.Group(),riB=new THREE.Group();scene.add(hiB,riB);
