<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sankey - Hiring Funnel</title>
    <!-- Use Kalam font to match the handwritten marker style in the image -->
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f1efea;
            font-family: 'Kalam', cursive;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 40px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #2a2a2a;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
        }

        .btn-group {
            display: flex;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            overflow: hidden;
            border: 1px solid #e0ded8;
        }

        .btn {
            padding: 8px 16px;
            font-family: 'Kalam', cursive;
            font-size: 16px;
            color: #555;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn.active {
            background: #e8f5ed;
            color: #31955b;
            font-weight: 700;
        }

        .btn-single {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e0ded8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .legend {
            display: flex;
            gap: 20px;
            align-items: center;
            pointer-events: auto;
            padding-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #333;
        }

        .dot {
            width: 14px;
            height: 10px;
            border-radius: 4px;
        }

        /* 3D Space Labels */
        .node-label {
            font-family: 'Kalam', cursive;
            font-size: 14px;
            color: #111;
            font-weight: 700;
            white-space: nowrap;
            margin-top: -10px;
            pointer-events: none;
            text-shadow: 0px 0px 8px rgba(255,255,255,0.4);
        }
    </style>

    <!-- Import Three.js via ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- UI Overlay matching the image -->
    <div class="ui-layer">
        <div class="header">
            <h1 class="title">QA · Sankey · hiring funnel by source</h1>
            <div class="toolbar">
                <div class="btn-group">
                    <button class="btn">☐ 2D</button>
                    <button class="btn active">⚄ 3D</button>
                </div>
                <button class="btn btn-single">Sankey ⌄</button>
                <button class="btn btn-single">⭳ Export ⌄</button>
                <button class="btn btn-single">👁</button>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:#31955b"></div>Referrals</div>
            <div class="legend-item"><div class="dot" style="background:#d4a34b"></div>Screened</div>
            <div class="legend-item"><div class="dot" style="background:#5bc0eb"></div>Job boards</div>
            <div class="legend-item"><div class="dot" style="background:#d9389e"></div>Linkedin</div>
            <div class="legend-item"><div class="dot" style="background:#f27b10"></div>Interviewed</div>
            <div class="legend-item"><div class="dot" style="background:#40c9c5"></div>Rejected</div>
            <div class="legend-item"><div class="dot" style="background:#295fb2"></div>Offered</div>
            <div class="legend-item"><div class="dot" style="background:#8ec448"></div>Hired</div>
            <div class="legend-item"><div class="dot" style="background:#d33b3b"></div>Declined</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- 1. SETUP SCENE, CAMERA, RENDERERS ---
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        // Match the background color of the UI
        scene.background = new THREE.Color('#f1efea');
        scene.fog = new THREE.Fog('#f1efea', 30, 80);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        // Position camera to match the isometric-style angle in the image
        camera.position.set(-2, 10, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        // Filmic tone mapping for photorealistic light/color handling
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(1, 1, 0);

        // --- 2. LIGHTING (Studio Setup) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffdfa, 2.5);
        dirLight.position.set(10, 20, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
        rimLight.position.set(-15, 10, -15);
        scene.add(rimLight);

        // --- 3. BASE PLATFORM ---
        const platformGeo = new RoundedBoxGeometry(32, 0.5, 14, 6, 0.5);
        const platformMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.8,
            metalness: 0.1
        });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(1, -4.5, -1);
        platform.receiveShadow = true;
        scene.add(platform);

        // --- 4. MATERIAL FACTORY (Frosted Glass) ---
        function createGlassMaterial(hexColor, transmission=0.9, opacity=1.0) {
            return new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(hexColor),
                metalness: 0.1,
                roughness: 0.25, // Frosted look
                transmission: transmission, // Glassy
                thickness: 2.0, // Volume for refraction
                ior: 1.5,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
        }

        const mats = {
            blue: createGlassMaterial('#5bc0eb'),
            pink: createGlassMaterial('#e559ba'),
            green: createGlassMaterial('#31955b'),
            yellow: createGlassMaterial('#f4b333', 0.95), // Screened bar
            orange: createGlassMaterial('#f17a23', 0.95), // Interviewed bar
            teal: createGlassMaterial('#40c9c5'),
            darkBlue: createGlassMaterial('#295fb2'),
            lightGreen: createGlassMaterial('#8cc63f'),
            red: createGlassMaterial('#d83c3c')
        };

        // --- 5. CUSTOM GEOMETRY GENERATOR FOR SANKEY FLOWS ---
        // Creates a 3D ribbon that smoothly interpolates heights and widths
        function createSankeyFlow(startX, endX, topY1, botY1, topY2, botY2, zDepth, material) {
            const segments = 64;
            const vertices = [];
            const indices = [];
            const normals = [];

            // Helper to evaluate cubic bezier
            const getBezier = (t, p0, p1, p2, p3) => {
                const mt = 1 - t;
                return mt*mt*mt*p0 + 3*mt*mt*t*p1 + 3*mt*t*t*p2 + t*t*t*p3;
            };

            const midX = startX + (endX - startX) * 0.5;

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const x = getBezier(t, startX, midX, midX, endX);
                const topY = getBezier(t, topY1, topY1, topY2, topY2);
                const botY = getBezier(t, botY1, botY1, botY2, botY2);
                const z = zDepth / 2;

                // 4 Vertices per slice (Top-Front, Bot-Front, Top-Back, Bot-Back)
                vertices.push(x, topY, z);
                vertices.push(x, botY, z);
                vertices.push(x, topY, -z);
                vertices.push(x, botY, -z);

                if (i > 0) {
                    const curr = i * 4;
                    const prev = (i - 1) * 4;

                    // Front
                    indices.push(prev, prev+1, curr);
                    indices.push(prev+1, curr+1, curr);
                    // Back
                    indices.push(prev+2, curr+2, prev+3);
                    indices.push(prev+3, curr+2, curr+3);
                    // Top
                    indices.push(prev, curr, prev+2);
                    indices.push(prev+2, curr, curr+2);
                    // Bottom
                    indices.push(prev+1, prev+3, curr+1);
                    indices.push(prev+3, curr+3, curr+1);
                }
            }

            // Left Cap
            indices.push(0, 2, 1);
            indices.push(1, 2, 3);
            // Right Cap
            const last = segments * 4;
            indices.push(last, last+1, last+2);
            indices.push(last+1, last+3, last+2);

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();

            const mesh = new THREE.Mesh(geo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // --- 6. ADDING NODES (Rounded blocks at start/end of flows) ---
        function addNode(x, yCenter, height, zDepth, material, labelText) {
            let geo;
            if(labelText && labelText.includes('Job boards')) {
                // Job boards has a semi-cylindrical shape in the image
                geo = new RoundedBoxGeometry(1.5, height, zDepth + 0.3, 4, 0.4);
            } else {
                geo = new RoundedBoxGeometry(1.2, height, zDepth + 0.2, 4, 0.2);
            }
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, yCenter, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            if (labelText) {
                const div = document.createElement('div');
                div.className = 'node-label';
                div.textContent = labelText;
                const label = new CSS2DObject(div);
                label.position.set(0, 0, (zDepth/2) + 0.3);
                mesh.add(label);
            }
            return mesh;
        }

        // --- 7. BUILD THE GRAPH ---
        
        // --- Stage 1: Sources ---
        // X = -8
        addNode(-8, 5.3, 2.6, 1.0, mats.blue, "Job boards - 260");
        addNode(-8, 2.3, 1.8, 1.0, mats.pink, "Linkedin - 180");
        addNode(-8, -0.3, 1.4, 1.0, mats.green, "Referrals - 120");

        // --- Stage 2: Screened (Yellow thin vertical bar) ---
        // X = -3.5
        const screenedBar = addNode(-3.5, 2.8, 7.8, 1.4, mats.yellow, "");
        const sDiv = document.createElement('div');
        sDiv.className = 'node-label';
        sDiv.textContent = "Screened - 560";
        const sLabel = new CSS2DObject(sDiv);
        sLabel.position.set(0, 0, 1.5);
        screenedBar.add(sLabel);

        // --- Stage 3: Interviewed (Orange thin vertical bar) ---
        // X = 1
        const interviewBar = addNode(1.0, 1.6, 3.8, 1.4, mats.orange, "");
        const iDiv = document.createElement('div');
        iDiv.className = 'node-label';
        iDiv.textContent = "Interviewed - 210";
        const iLabel = new CSS2DObject(iDiv);
        iLabel.position.set(0, 0, 1.5);
        interviewBar.add(iLabel);

        // --- Stage 4 & 5 Caps ---
        // Rejected block (Teal)
        addNode(6.3, 4.0, 5.0, 1.0, mats.teal, "Rejected - 496");
        
        // Hired block (Light Green)
        addNode(11, -0.2, 0.7, 1.0, mats.lightGreen, "Hired - 48");
        
        // Declined block (Red)
        addNode(11.1, -1.2, 0.4, 1.0, mats.red, "Declined - 16");

        const offeredDiv = document.createElement('div');
        offeredDiv.className = 'node-label';
        offeredDiv.textContent = "Offered - 64";
        const oLabel = new CSS2DObject(offeredDiv);
        oLabel.position.set(6.4, -3.8, 1.5);
        scene.add(oLabel);


        // --- BUILD FLOWS ---
        
        // 1. Job Boards (Blue) to Interviewed (Flow passes visually through yellow bar)
        // Starts: -8. Ends: 1.0
        scene.add(createSankeyFlow(-8, 1.0, 6.6, 4.0, 3.4, 1.8, 1.0, mats.blue));

        // 2. LinkedIn (Pink) to Interviewed
        scene.add(createSankeyFlow(-8, 1.0, 3.2, 1.4, 1.8, 0.6, 1.0, mats.pink));

        // 3. Referrals (Green) to Interviewed
        scene.add(createSankeyFlow(-8, 1.0, 0.4, -1.0, 0.6, -0.2, 1.0, mats.green));

        // 4. Interviewed to Rejected (Teal)
        // Expands massively upward
        scene.add(createSankeyFlow(1.0, 6.3, 3.4, 1.0, 6.5, 1.5, 1.0, mats.teal));

        // 5. Interviewed to Offered (Dark Blue)
        // Dips deeply down to create the U-shape
        scene.add(createSankeyFlow(1.0, 6.4, 1.0, -0.2, -2.5, -3.5, 1.0, mats.darkBlue));

        // 6. Offered to Hired (Light Green)
        // Splits from the bottom right
        scene.add(createSankeyFlow(6.4, 11, -2.5, -3.1, 0.15, -0.55, 1.0, mats.lightGreen));

        // 7. Offered to Declined (Red)
        scene.add(createSankeyFlow(6.4, 11, -3.1, -3.5, -1.0, -1.4, 1.0, mats.red));

        // --- 8. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
